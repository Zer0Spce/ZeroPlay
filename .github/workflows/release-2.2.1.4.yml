name: ZeroPlay 2.2.1.4 Android Hotfix Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeroplay-2-2-1-4-android-hotfix
  cancel-in-progress: false

env:
  ZERO_HOTFIX_VERSION: '2.2.1.4'

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Publish ZeroPlay 2.2.1.4 hotfix')
    name: Android Full + Lite 2.2.1.4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify hotfix source and version
        run: |
          set -euo pipefail
          grep -q "versionCode 49" app/build.gradle
          grep -q "versionName '2.2.1.4'" app/build.gradle
          grep -q 'android:name=".TvMainActivity"' app/src/tv/AndroidManifest.xml
          grep -q 'android:name=".LiteTvMainActivity"' app/src/liteTv/AndroidManifest.xml
          grep -q 'TvSystemIme.open(this)' app/src/main/java/com/zerostreams/app/TvMainActivity.java
          grep -q 'TvSystemIme.open(this)' app/src/main/java/com/zerostreams/app/LiteTvMainActivity.java
          test -f app/src/main/java/com/zerostreams/app/TvSystemIme.java
          test ! -e app/src/main/java/com/zerostreams/app/TvSearchIme.java
          grep -q 'tvSystemImePicker214' app/src/main/java/com/zerostreams/app/TvSystemIme.java
          grep -q 'if(!pickerSeen)' app/src/main/java/com/zerostreams/app/TvSystemIme.java
          grep -q 'showInputMethodPicker' app/src/main/java/com/zerostreams/app/TvSystemIme.java
          grep -q 'showSoftInput(field,InputMethodManager.SHOW_IMPLICIT)' app/src/main/java/com/zerostreams/app/TvSystemIme.java
          ! grep -q 'new Dialog' app/src/main/java/com/zerostreams/app/TvSystemIme.java
          ! grep -q 'QWERTYUIOP' app/src/main/java/com/zerostreams/app/TvSystemIme.java
          grep -q "implementation 'com.google.zxing:core:3.5.3'" app/build.gradle

      - name: Refresh Android dependencies
        run: |
          set -euo pipefail
          gradle --refresh-dependencies :app:dependencies --configuration mobileReleaseCompileClasspath >/tmp/zeroplay-dependencies.txt
          grep -q 'com.google.zxing:core:3.5.3' /tmp/zeroplay-dependencies.txt

      - name: Android and TV regressions
        run: |
          set -euo pipefail
          node --test tests/android-tv-search-ime.test.cjs
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs
          npm install --prefix /tmp/zero-release-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-release-tests/node_modules node tests/tv-navigation.test.cjs
          ZERO_GUARD_PATH=app/src/main/assets/player-guard.js NODE_PATH=/tmp/zero-release-tests/node_modules node tests/player-guard.test.cjs

      - name: Unit tests — all Android variants
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest :app:testLiteMobileReleaseUnitTest :app:testLiteTvReleaseUnitTest

      - name: Build signed production APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease :app:assembleLiteMobileRelease :app:assembleLiteTvRelease
          mobile=app/build/outputs/apk/mobile/release/app-mobile-release.apk
          tv=app/build/outputs/apk/tv/release/app-tv-release.apk
          liteMobile=app/build/outputs/apk/liteMobile/release/app-liteMobile-release.apk
          liteTv=app/build/outputs/apk/liteTv/release/app-liteTv-release.apk
          for apk in "$mobile" "$tv" "$liteMobile" "$liteTv"; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionName='2.2.1.4'"
          done
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$mobile" | head -n 1 | grep -q "name='com.zerostreams.app.mobile'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$tv" | head -n 1 | grep -q "name='com.zerostreams.app.tv'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$liteMobile" | head -n 1 | grep -q "name='com.zerostreams.app.lite.mobile'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$liteTv" | head -n 1 | grep -q "name='com.zerostreams.app.lite.tv'"
          mkdir -p release-assets
          cp "$mobile" release-assets/ZeroPlay-2.2.1.4-Android.apk
          cp "$tv" release-assets/ZeroPlay-2.2.1.4-Android-TV.apk
          cp "$liteMobile" release-assets/ZeroPlay-2.2.1.4-Android-Lite.apk
          cp "$liteTv" release-assets/ZeroPlay-2.2.1.4-Android-TV-Lite.apk

      - name: Lint all Android variants
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease :app:lintLiteMobileRelease :app:lintLiteTvRelease

      - name: Audit Android production assets
        run: python scripts/audit-release-secrets.py release-assets app/src

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.1.4-Android-Production
          path: release-assets/*.apk
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish ZeroPlay 2.2.1.4 Android Hotfix
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.1.4-Android-Production
          path: release-assets
      - name: Final Android asset and credential audit
        run: |
          set -euo pipefail
          for file in ZeroPlay-2.2.1.4-Android.apk ZeroPlay-2.2.1.4-Android-TV.apk ZeroPlay-2.2.1.4-Android-Lite.apk ZeroPlay-2.2.1.4-Android-TV-Lite.apk; do test -f "release-assets/$file"; done
          python scripts/audit-release-secrets.py release-assets
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum ZeroPlay-2.2.1.4-Android.apk ZeroPlay-2.2.1.4-Android-TV.apk ZeroPlay-2.2.1.4-Android-Lite.apk ZeroPlay-2.2.1.4-Android-TV-Lite.apk > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.1.4 >/dev/null 2>&1; then echo 'v2.2.1.4 already exists'; exit 1; fi
          gh release create v2.2.1.4 release-assets/ZeroPlay-2.2.1.4-Android.apk release-assets/ZeroPlay-2.2.1.4-Android-TV.apk release-assets/ZeroPlay-2.2.1.4-Android-Lite.apk release-assets/ZeroPlay-2.2.1.4-Android-TV-Lite.apk release-assets/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'ZeroPlay 2.2.1.4 — Android TV System Keyboard Hotfix' --notes-file docs/release-2.2.1.4.md --latest
