name: Validate ZeroPlay 2.2 Release Candidate

on:
  push:
    branches: [release/2.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeroplay-2-2-release-candidate
  cancel-in-progress: true

jobs:
  android:
    name: Android Full + Lite
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify 2.2 + Lite configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 44" app/build.gradle
          grep -q "versionName '2.2'" app/build.gradle
          grep -q "liteMobile" app/build.gradle
          grep -q "liteTv" app/build.gradle
          grep -q "buildConfigField 'boolean', 'LITE', 'true'" app/build.gradle
          grep -q 'class LiteMainActivity' app/src/main/java/com/zerostreams/app/LiteMainActivity.java
          grep -q 'performanceMode",true' app/src/main/java/com/zerostreams/app/LiteMainActivity.java
          test -f app/src/liteMobile/AndroidManifest.xml
          test -f app/src/liteTv/AndroidManifest.xml
          grep -q 'Hybrid' docs/android-tv-controls.md
          grep -q 'Embedwave (BETA)' README.md

      - name: Player/source regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs
          npm install --prefix /tmp/zero-release-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-release-tests/node_modules node tests/tv-navigation.test.cjs
          ZERO_GUARD_PATH=app/src/main/assets/player-guard.js NODE_PATH=/tmp/zero-release-tests/node_modules node tests/player-guard.test.cjs

      - name: Unit tests — all Android variants
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest :app:testLiteMobileReleaseUnitTest :app:testLiteTvReleaseUnitTest

      - name: Build signed release APKs — all Android variants
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease :app:assembleLiteMobileRelease :app:assembleLiteTvRelease
          declare -A files=(
            [mobile]='app/build/outputs/apk/mobile/release/app-mobile-release.apk'
            [tv]='app/build/outputs/apk/tv/release/app-tv-release.apk'
            [liteMobile]='app/build/outputs/apk/liteMobile/release/app-liteMobile-release.apk'
            [liteTv]='app/build/outputs/apk/liteTv/release/app-liteTv-release.apk'
          )
          for key in mobile tv liteMobile liteTv; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "${files[$key]}"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "${files[$key]}" | head -n 1 | grep -q "versionName='2.2'"
          done
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "${files[mobile]}" | head -n 1 | grep -q "name='com.zerostreams.app.mobile'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "${files[tv]}" | head -n 1 | grep -q "name='com.zerostreams.app.tv'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "${files[liteMobile]}" | head -n 1 | grep -q "name='com.zerostreams.app.lite.mobile'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "${files[liteTv]}" | head -n 1 | grep -q "name='com.zerostreams.app.lite.tv'"
          mkdir -p release-assets
          cp "${files[mobile]}" release-assets/ZeroPlay-2.2-Android.apk
          cp "${files[tv]}" release-assets/ZeroPlay-2.2-Android-TV.apk
          cp "${files[liteMobile]}" release-assets/ZeroPlay-2.2-Android-Lite.apk
          cp "${files[liteTv]}" release-assets/ZeroPlay-2.2-Android-TV-Lite.apk

      - name: Lint — all Android variants
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease :app:lintLiteMobileRelease :app:lintLiteTvRelease

      - name: Audit Android candidate assets
        run: python scripts/audit-release-secrets.py release-assets app/src

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2-Android-Release-Candidate
          path: release-assets/*.apk
          if-no-files-found: error
          compression-level: 0

  web:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax + unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --check web/public/browser.js
          node --check web/public/app.js
          node --check web/public/playback-sources.js
          node --check web/public/zero22.js
          node --check web/public/infinite-scroll.js
          node --test web/test/*.test.cjs
      - name: UI regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/zero-web-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-web-tests/node_modules node web/scripts/ui-check.cjs
      - name: Verify web-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Embedwave (BETA)' web/public/index.html
          ! grep -Eq 'Live TV|Live Sports|PPV' web/public/index.html
          grep -q 'zero22CatalogRequest' web/public/infinite-scroll.js
      - name: Validate website build
        run: node web/scripts/build.cjs

  windows:
    name: Windows Production Shape
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve committed line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Windows dependencies
        working-directory: windows
        run: npm ci --no-audit --no-fund

      - name: 2.2 regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs
          node tests/windows-home-panel-order.test.cjs
          node tests/windows-upnext-items-dedupe.test.cjs
          Push-Location windows
          npm test
          npm install --prefix ../ui-test-deps --no-audit --no-fund jsdom@24.1.3
          $env:NODE_PATH = "${{ github.workspace }}\ui-test-deps\node_modules"
          foreach ($script in @('scripts/ui-check.cjs','scripts/experience-check.cjs','scripts/layout-check.cjs','scripts/live-compat-check.cjs','scripts/player-exit-check.cjs')) {
            node $script
            if ($LASTEXITCODE -ne 0) { throw "Desktop regression failed: $script" }
          }
          npx electron scripts/media-check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop media regression failed' }
          node scripts/tmdb-check.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop TMDB regression failed' }
          $env:ZERO_GUARD_PATH='assets/player-guard.js'
          node ../tests/player-guard.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Player guard regression failed' }
          Pop-Location

      - name: Configure bundled production keys/vendors
        working-directory: windows
        run: npm run prepare-config

      - name: Download pinned mpv x64 engine
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261009/mpv-x86_64-20261009-git-36abaa32d0.7z'
          $expected='9afbe74f4ab885ca512769f8835758eb66b7b8a5ea6d679500588f8e7fec632e'
          Invoke-WebRequest -Uri $url -OutFile mpv.7z
          $actual=(Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "mpv SHA-256 mismatch: $actual"}
          New-Item -ItemType Directory -Force vendor/mpv | Out-Null
          7z x mpv.7z -ovendor/mpv -y | Out-Host
          $mpv=Get-ChildItem vendor/mpv -Filter mpv.exe -Recurse | Select-Object -First 1
          if(-not $mpv){throw 'mpv.exe missing after extraction'}
          if($mpv.Directory.FullName -ne (Resolve-Path vendor/mpv).Path){Copy-Item "$($mpv.Directory.FullName)/*" vendor/mpv -Recurse -Force}
          if(!(Test-Path vendor/mpv/mpv.exe)){throw 'mpv.exe normalization failed'}
          Remove-Item mpv.7z -Force

      - name: Apply preserved 2.1.2 production-only Windows stack
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @(
            'scripts/apply-offline-mpv-test.cjs',
            'scripts/apply-final-windows-polish.cjs',
            'scripts/apply-episode-progress-fix.cjs',
            'scripts/apply-windows-episode-completion-fix.cjs',
            'scripts/fix-final-windows-action-tdz.cjs',
            'scripts/apply-2.1.2-player-adblock.cjs'
          )){
            node $script
            if($LASTEXITCODE -ne 0){throw "Production stack failed: $script"}
          }
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version='2.2.0'
          $pkg.build.win.artifactName='ZeroPlay-2.2-Windows-x64.${ext}'
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8
          node --check main.cjs
          node --check ui/app.js

      - name: Build native mpv host + ZeroPlayUpdater
        shell: pwsh
        working-directory: windows
        run: |
          dotnet publish mpv-host-helper/MpvVideoHost.csproj -c Release -r win-x64 --self-contained true -o mpv-host-helper/publish
          Copy-Item mpv-host-helper/publish/MpvVideoHost.exe ./MpvVideoHost.exe -Force
          dotnet publish updater-helper/ZeroPlayUpdater.csproj -c Release -r win-x64 --self-contained true -o updater-helper/publish
          Copy-Item updater-helper/publish/ZeroPlayUpdater.exe ./ZeroPlayUpdater.exe -Force
          if(!(Test-Path MpvVideoHost.exe)){throw 'MpvVideoHost.exe missing'}
          if(!(Test-Path ZeroPlayUpdater.exe)){throw 'ZeroPlayUpdater.exe missing'}

      - name: Verify combined 2.2 + production stack
        shell: pwsh
        working-directory: windows
        run: |
          $main=Get-Content main.cjs -Raw
          $ui=Get-Content ui/app.js -Raw
          $sources=Get-Content playback-sources.cjs -Raw
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          if($pkg.version -ne '2.2.0'){throw 'Windows production version is not 2.2.0'}
          if($sources -notmatch 'embedwave'){throw 'Embedwave source missing after production stack'}
          if($main -notmatch 'autoSourceRecovery'){throw '2.2 source recovery logic missing after production stack'}
          if($main -notmatch 'MpvOfflinePlayer'){throw 'Production mpv offline player missing'}
          if($main -notmatch 'contents\.session\.webRequest\.onBeforeRequest'){throw 'Production player request filtering missing'}
          if($ui -match 'Zero player controls|player-toolbar-22'){throw 'Experimental normal-player toolbar returned'}

      - name: Electron smoke test — production shape
        timeout-minutes: 9
        shell: pwsh
        working-directory: windows
        run: |
          npx electron . --smoke-test
          if($LASTEXITCODE -ne 0){throw "Windows production-shape smoke failed: $LASTEXITCODE"}

      - name: Build portable candidate
        working-directory: windows
        run: npx electron-builder --win --x64 --publish never

      - name: Verify packaged candidate
        shell: pwsh
        working-directory: windows
        run: |
          $zip='dist/ZeroPlay-2.2-Windows-x64.zip'
          if(!(Test-Path $zip)){throw 'ZeroPlay 2.2 Windows ZIP missing'}
          if(!(Test-Path 'dist/win-unpacked/ZeroPlay.exe')){throw 'ZeroPlay.exe missing'}
          if(!(Test-Path 'dist/win-unpacked/ZeroPlayUpdater.exe')){throw 'Updater missing'}
          if(!(Test-Path 'dist/win-unpacked/resources/mpv/mpv.exe')){throw 'Bundled mpv missing'}
          if(!(Test-Path 'dist/win-unpacked/resources/mpv-host/MpvVideoHost.exe')){throw 'mpv host missing'}
          $verify='dist/verify-asar'
          if(Test-Path $verify){Remove-Item $verify -Recurse -Force}
          npx --yes @electron/asar extract 'dist/win-unpacked/resources/app.asar' $verify
          $pkg=Get-Content "$verify/package.json" -Raw | ConvertFrom-Json
          $main=Get-Content "$verify/main.cjs" -Raw
          $sources=Get-Content "$verify/playback-sources.cjs" -Raw
          if($pkg.version -ne '2.2.0'){throw 'Packaged Windows version mismatch'}
          if($sources -notmatch 'embedwave'){throw 'Packaged Embedwave source missing'}
          if($main -notmatch 'autoSourceRecovery'){throw 'Packaged 2.2 source recovery missing'}
          if($main -notmatch 'MpvOfflinePlayer'){throw 'Packaged mpv offline player missing'}
          Remove-Item $verify -Recurse -Force

      - name: Audit Windows candidate
        run: python scripts/audit-release-secrets.py windows/dist/ZeroPlay-2.2-Windows-x64.zip windows/dist/win-unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2-Windows-Release-Candidate
          path: windows/dist/ZeroPlay-2.2-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
