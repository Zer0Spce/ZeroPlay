name: ZeroPlay 2.2.1.1 Hotfix Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeroplay-2-2-1-1-hotfix
  cancel-in-progress: false

env:
  ZERO_HOTFIX_VERSION: '2.2.1.1'

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Publish ZeroPlay 2.2.1.1 hotfix')
    name: Android Full + Lite 2.2.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify hotfix source and version
        run: |
          set -euo pipefail
          grep -q "versionCode 46" app/build.gradle
          grep -q "versionName '2.2.1.1'" app/build.gradle
          grep -q 'android:name=".TvMainActivity"' app/src/tv/AndroidManifest.xml
          grep -q 'android:name=".LiteTvMainActivity"' app/src/liteTv/AndroidManifest.xml
          grep -q 'TvSearchIme.show(this)' app/src/main/java/com/zerostreams/app/TvMainActivity.java
          grep -q 'TvSearchIme.show(this)' app/src/main/java/com/zerostreams/app/LiteTvMainActivity.java
          grep -q 'restartInput(field)' app/src/main/java/com/zerostreams/app/TvSearchIme.java
          grep -q 'showSoftInput(field,InputMethodManager.SHOW_IMPLICIT)' app/src/main/java/com/zerostreams/app/TvSearchIme.java

      - name: Android and TV regressions
        run: |
          set -euo pipefail
          node --test tests/android-tv-search-ime.test.cjs
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs
          npm install --prefix /tmp/zero-release-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-release-tests/node_modules node tests/tv-navigation.test.cjs
          ZERO_GUARD_PATH=app/src/main/assets/player-guard.js NODE_PATH=/tmp/zero-release-tests/node_modules node tests/player-guard.test.cjs

      - name: Unit tests — all Android variants
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest :app:testLiteMobileReleaseUnitTest :app:testLiteTvReleaseUnitTest

      - name: Build signed production APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease :app:assembleLiteMobileRelease :app:assembleLiteTvRelease
          mobile=app/build/outputs/apk/mobile/release/app-mobile-release.apk
          tv=app/build/outputs/apk/tv/release/app-tv-release.apk
          liteMobile=app/build/outputs/apk/liteMobile/release/app-liteMobile-release.apk
          liteTv=app/build/outputs/apk/liteTv/release/app-liteTv-release.apk
          for apk in "$mobile" "$tv" "$liteMobile" "$liteTv"; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionName='2.2.1.1'"
          done
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$mobile" | head -n 1 | grep -q "name='com.zerostreams.app.mobile'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$tv" | head -n 1 | grep -q "name='com.zerostreams.app.tv'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$liteMobile" | head -n 1 | grep -q "name='com.zerostreams.app.lite.mobile'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$liteTv" | head -n 1 | grep -q "name='com.zerostreams.app.lite.tv'"
          mkdir -p release-assets
          cp "$mobile" release-assets/ZeroPlay-2.2.1.1-Android.apk
          cp "$tv" release-assets/ZeroPlay-2.2.1.1-Android-TV.apk
          cp "$liteMobile" release-assets/ZeroPlay-2.2.1.1-Android-Lite.apk
          cp "$liteTv" release-assets/ZeroPlay-2.2.1.1-Android-TV-Lite.apk

      - name: Lint all Android variants
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease :app:lintLiteMobileRelease :app:lintLiteTvRelease

      - name: Audit Android production assets
        run: python scripts/audit-release-secrets.py release-assets app/src

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.1.1-Android-Production
          path: release-assets/*.apk
          if-no-files-found: error
          compression-level: 0

  web:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Publish ZeroPlay 2.2.1.1 hotfix')
    name: Website regression validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate unchanged website surface
        run: |
          set -euo pipefail
          node --check web/public/browser.js
          node --check web/public/app.js
          node --check web/public/playback-sources.js
          node --check web/public/zero22.js
          node --check web/public/hero-trailer.js
          node --check web/public/web-router.js
          node --test web/test/*.test.cjs
          npm install --prefix /tmp/zero-web-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-web-tests/node_modules node web/scripts/ui-check.cjs
          node web/scripts/build.cjs

  windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Publish ZeroPlay 2.2.1.1 hotfix')
    name: Windows Portable 2.2.1.1
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve committed line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install dependencies
        working-directory: windows
        run: npm ci --no-audit --no-fund

      - name: Windows regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs
          node tests/windows-home-panel-order.test.cjs
          node tests/windows-upnext-items-dedupe.test.cjs
          Push-Location windows
          npm test
          npm install --prefix ../ui-test-deps --no-audit --no-fund jsdom@24.1.3
          $env:NODE_PATH="${{ github.workspace }}\ui-test-deps\node_modules"
          foreach($script in @('scripts/ui-check.cjs','scripts/experience-check.cjs','scripts/layout-check.cjs','scripts/live-compat-check.cjs','scripts/player-exit-check.cjs')){
            node $script
            if($LASTEXITCODE -ne 0){throw "Desktop regression failed: $script"}
          }
          npx electron scripts/media-check.cjs
          if($LASTEXITCODE -ne 0){throw 'Media regression failed'}
          node scripts/tmdb-check.cjs
          if($LASTEXITCODE -ne 0){throw 'TMDB regression failed'}
          $env:ZERO_GUARD_PATH='assets/player-guard.js'
          node ../tests/player-guard.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Player guard regression failed'}
          Pop-Location

      - name: Configure bundled production keys/vendors
        working-directory: windows
        run: npm run prepare-config

      - name: Download pinned mpv x64 engine
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261009/mpv-x86_64-20261009-git-36abaa32d0.7z'
          $expected='9afbe74f4ab885ca512769f8835758eb66b7b8a5ea6d679500588f8e7fec632e'
          Invoke-WebRequest -Uri $url -OutFile mpv.7z
          $actual=(Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "mpv SHA-256 mismatch: $actual"}
          New-Item -ItemType Directory -Force vendor/mpv | Out-Null
          7z x mpv.7z -ovendor/mpv -y | Out-Host
          $mpv=Get-ChildItem vendor/mpv -Filter mpv.exe -Recurse | Select-Object -First 1
          if(-not $mpv){throw 'mpv.exe missing after extraction'}
          if($mpv.Directory.FullName -ne (Resolve-Path vendor/mpv).Path){Copy-Item "$($mpv.Directory.FullName)/*" vendor/mpv -Recurse -Force}
          if(!(Test-Path vendor/mpv/mpv.exe)){throw 'mpv.exe normalization failed'}
          Remove-Item mpv.7z -Force

      - name: Apply preserved production Windows stack
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @(
            'scripts/apply-offline-mpv-test.cjs',
            'scripts/apply-final-windows-polish.cjs',
            'scripts/apply-episode-progress-fix.cjs',
            'scripts/apply-windows-episode-completion-fix.cjs',
            'scripts/fix-final-windows-action-tdz.cjs',
            'scripts/apply-2.1.2-player-adblock.cjs',
            'scripts/apply-2.2.1.1-version.cjs'
          )){
            node $script
            if($LASTEXITCODE -ne 0){throw "Production stack failed: $script"}
          }
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version='2.2.1-1'
          $pkg.build.buildVersion='2.2.1.1'
          $pkg.build.win.artifactName='ZeroPlay-2.2.1.1-Windows-x64.${ext}'
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8
          node --check main.cjs
          node --check updater.cjs
          node --check version-manager.cjs
          node --check ui/app.js
          node --check ui/home-visuals.js

      - name: Build native video host and updater
        shell: pwsh
        working-directory: windows
        run: |
          dotnet publish mpv-host-helper/MpvVideoHost.csproj -c Release -r win-x64 --self-contained true -o mpv-host-helper/publish
          Copy-Item mpv-host-helper/publish/MpvVideoHost.exe ./MpvVideoHost.exe -Force
          dotnet publish updater-helper/ZeroPlayUpdater.csproj -c Release -r win-x64 --self-contained true -o updater-helper/publish
          Copy-Item updater-helper/publish/ZeroPlayUpdater.exe ./ZeroPlayUpdater.exe -Force
          if(!(Test-Path MpvVideoHost.exe)){throw 'MpvVideoHost.exe missing'}
          if(!(Test-Path ZeroPlayUpdater.exe)){throw 'ZeroPlayUpdater.exe missing'}

      - name: Verify combined production source
        shell: pwsh
        working-directory: windows
        run: |
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          $main=Get-Content main.cjs -Raw
          $ui=Get-Content ui/app.js -Raw
          $visuals=Get-Content ui/home-visuals.js -Raw
          $sources=Get-Content playback-sources.cjs -Raw
          if($pkg.version -ne '2.2.1-1'){throw 'Expected internal Windows SemVer 2.2.1-1'}
          if($pkg.build.buildVersion -ne '2.2.1.1'){throw 'Expected Windows buildVersion 2.2.1.1'}
          if($main -notmatch 'version:versions\.normalizedVersion\(app\.getVersion\(\)\)'){throw 'Normalized 2.2.1.1 display version missing'}
          if($sources -notmatch 'embedwave'){throw 'Embedwave missing'}
          if($main -notmatch 'autoSourceRecovery'){throw '2.2 source recovery logic missing'}
          if($main -notmatch 'MpvOfflinePlayer'){throw 'Production mpv offline player missing'}
          if($main -notmatch 'contents\.session\.webRequest\.onBeforeRequest'){throw 'Production request filtering missing'}
          if($ui -notmatch 'window\.zeroOpenDetails'){throw 'Top 10 detail bridge missing'}
          if($visuals -notmatch 'zeroplay-top10-optout'){throw 'Top 10 Home toggle missing'}
          node --test test/updater.test.cjs

      - name: Electron smoke test
        timeout-minutes: 9
        shell: pwsh
        working-directory: windows
        run: |
          npx electron . --smoke-test
          if($LASTEXITCODE -ne 0){throw "Electron smoke test failed: $LASTEXITCODE"}

      - name: Build portable Windows ZIP
        working-directory: windows
        run: npx electron-builder --win --x64 --publish never

      - name: Verify portable production package
        shell: pwsh
        working-directory: windows
        run: |
          $zip='dist/ZeroPlay-2.2.1.1-Windows-x64.zip'
          if(!(Test-Path $zip)){throw 'Windows 2.2.1.1 portable ZIP was not created'}
          if(!(Test-Path 'dist/win-unpacked/ZeroPlay.exe')){throw 'ZeroPlay.exe missing'}
          if(!(Test-Path 'dist/win-unpacked/ZeroPlayUpdater.exe')){throw 'ZeroPlayUpdater.exe missing'}
          if(!(Test-Path 'dist/win-unpacked/resources/mpv/mpv.exe')){throw 'Bundled mpv.exe missing'}
          if(!(Test-Path 'dist/win-unpacked/resources/mpv-host/MpvVideoHost.exe')){throw 'Native mpv host missing'}
          $verify='dist/verify-asar'
          if(Test-Path $verify){Remove-Item $verify -Recurse -Force}
          npx --yes @electron/asar extract 'dist/win-unpacked/resources/app.asar' $verify
          $pkg=Get-Content "$verify/package.json" -Raw | ConvertFrom-Json
          $main=Get-Content "$verify/main.cjs" -Raw
          $updater=Get-Content "$verify/updater.cjs" -Raw
          $versions=Get-Content "$verify/version-manager.cjs" -Raw
          if($pkg.version -ne '2.2.1-1'){throw 'Packaged internal version mismatch'}
          if($pkg.build.buildVersion -ne '2.2.1.1'){throw 'Packaged buildVersion mismatch'}
          if($main -notmatch 'version:versions\.normalizedVersion\(app\.getVersion\(\)\)'){throw 'Packaged display-version normalization missing'}
          if($updater -notmatch 'hotfix'){throw 'Packaged updater hotfix version mapping missing'}
          if($versions -notmatch 'hotfix'){throw 'Packaged version-manager hotfix mapping missing'}
          if($main -notmatch 'MpvOfflinePlayer'){throw 'Packaged mpv offline player missing'}
          if($updater -notmatch 'ZeroPlayUpdater\.exe'){throw 'Packaged updater wiring missing'}
          if($updater -match 'tar\.exe|Expand-Archive|robocopy\.exe'){throw 'Legacy updater replacement logic packaged'}
          Remove-Item $verify -Recurse -Force

      - name: Audit Windows production credentials
        run: python scripts/audit-release-secrets.py windows/dist/ZeroPlay-2.2.1.1-Windows-x64.zip windows/dist/win-unpacked

      - name: Microsoft Defender scan
        shell: pwsh
        working-directory: windows
        run: |
          $scanner=(Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if(-not $scanner){throw 'Microsoft Defender scanner unavailable; release blocked'}
          & $scanner -Scan -ScanType 3 -File "$pwd\dist\win-unpacked" -DisableRemediation
          if($LASTEXITCODE -ne 0){throw "Defender scan failed or detected a threat (exit $LASTEXITCODE); release blocked"}

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.1.1-Windows-Production
          path: windows/dist/ZeroPlay-2.2.1.1-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Publish ZeroPlay 2.2.1.1 hotfix')
    name: Publish ZeroPlay 2.2.1.1 Hotfix
    needs: [android, web, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.1.1-Android-Production
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.1.1-Windows-Production
          path: release-assets

      - name: Final asset and credential audit
        run: |
          set -euo pipefail
          for file in ZeroPlay-2.2.1.1-Android.apk ZeroPlay-2.2.1.1-Android-TV.apk ZeroPlay-2.2.1.1-Android-Lite.apk ZeroPlay-2.2.1.1-Android-TV-Lite.apk ZeroPlay-2.2.1.1-Windows-x64.zip; do
            test -f "release-assets/$file"
          done
          python scripts/audit-release-secrets.py release-assets

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ZeroPlay-2.2.1.1-Android.apk ZeroPlay-2.2.1.1-Android-TV.apk ZeroPlay-2.2.1.1-Android-Lite.apk ZeroPlay-2.2.1.1-Android-TV-Lite.apk ZeroPlay-2.2.1.1-Windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.1.1 >/dev/null 2>&1; then
            echo 'v2.2.1.1 already exists; refusing to overwrite an existing production release.'
            exit 1
          fi
          gh release create v2.2.1.1 \
            release-assets/ZeroPlay-2.2.1.1-Android.apk \
            release-assets/ZeroPlay-2.2.1.1-Android-TV.apk \
            release-assets/ZeroPlay-2.2.1.1-Android-Lite.apk \
            release-assets/ZeroPlay-2.2.1.1-Android-TV-Lite.apk \
            release-assets/ZeroPlay-2.2.1.1-Windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'ZeroPlay 2.2.1.1 — Android TV Search Keyboard Hotfix' \
            --notes-file docs/release-2.2.1.1.md \
            --latest

      - name: Update repository main page and changelog
        run: |
          set -euo pipefail
          python scripts/update-2.2.1.1-docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/changelog.md
          git diff --cached --check
          git commit -m 'Update README for ZeroPlay 2.2.1.1 hotfix'
          git push origin HEAD:main
