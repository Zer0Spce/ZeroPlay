name: ZeroPlay 2.2.5.6 — Android Native Live PPV (All Public APKs)

on:
  push:
    branches:
      - release/android-native-live-ppv-v2.2.5.6
    paths:
      - '.github/workflows/release-2.2.5.6-android.yml'
      - 'app/src/main/java/com/zerostreams/app/MainActivity.java'
      - 'tests/android-native-live-ppv-v2.2.5.6.test.cjs'
      - 'docs/releases/v2.2.5.6.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeroplay-2256-android-only
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Windows source and ZeroStreams untouched
        run: |
          set -euo pipefail
          git diff --quiet origin/main...HEAD -- windows
          git diff --quiet origin/main...HEAD -- .github/workflows/build-windows.yml
          echo 'No Windows source or Windows build files changed by v2.2.5.6'

      - name: Verify native Android player routing and preserved TV navigation
        run: |
          set -euo pipefail
          node --test tests/android-native-live-ppv-v2.2.5.6.test.cjs
          node tests/android-tv-source-navigation-2.2.5.4.test.cjs
          node tests/source-selection-regression.test.cjs
          node tests/default-player-controls-regression.test.cjs

      - name: Restore existing 2.2.5 Android feature stack; set version 2.2.5.6 code 60
        run: |
          set -euo pipefail
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node tests/audio-boost-2.2.4.1.test.cjs
          node scripts/apply-custom-livetv-test.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const file='app/build.gradle';
          let code=fs.readFileSync(file,'utf8');
          if(!code.includes("versionName '2.2.5-test1'")||!code.includes('versionCode 51'))throw Error('Unexpected Android version baseline');
          code=code.replace("versionName '2.2.5-test1'","versionName '2.2.5.6'");
          code=code.replace('versionCode 51','versionCode 60');
          fs.writeFileSync(file,code);
          NODE
          grep -Fq "versionName '2.2.5.6'" app/build.gradle
          grep -Fq 'versionCode 60' app/build.gradle
          node --test tests/android-native-live-ppv-v2.2.5.6.test.cjs

      - name: Test all four Android flavors
        run: |
          gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest :app:testLiteMobileReleaseUnitTest :app:testLiteTvReleaseUnitTest

      - name: Build and verify four signed Android APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-2.2.5.6.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease :app:assembleLiteMobileRelease :app:assembleLiteTvRelease
          mkdir -p release-builds
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk release-builds/ZeroPlay-2.2.5.6-Android.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk release-builds/ZeroPlay-2.2.5.6-Android-TV.apk
          cp app/build/outputs/apk/liteMobile/release/app-liteMobile-release.apk release-builds/ZeroPlay-2.2.5.6-Android-Lite.apk
          cp app/build/outputs/apk/liteTv/release/app-liteTv-release.apk release-builds/ZeroPlay-2.2.5.6-Android-TV-Lite.apk
          test "$(find release-builds -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          for apk in release-builds/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionName='2.2.5.6'"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionCode='60'"
          done

      - name: Lint four public Android flavors
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease :app:lintLiteMobileRelease :app:lintLiteTvRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-v2.2.5.6-All-Android
          path: release-builds/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    needs: [android]
    if: github.ref == 'refs/heads/release/android-native-live-ppv-v2.2.5.6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-v2.2.5.6-All-Android
          path: release-assets
      - name: Verify four Android APKs and create checksums
        run: |
          set -euo pipefail
          cd release-assets
          test -s ZeroPlay-2.2.5.6-Android.apk
          test -s ZeroPlay-2.2.5.6-Android-TV.apk
          test -s ZeroPlay-2.2.5.6-Android-Lite.apk
          test -s ZeroPlay-2.2.5.6-Android-TV-Lite.apk
          test "$(find . -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Publish Android-only v2.2.5.6 without updating Windows latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.5.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          gh release create v2.2.5.6 \
            release-assets/ZeroPlay-2.2.5.6-Android.apk \
            release-assets/ZeroPlay-2.2.5.6-Android-TV.apk \
            release-assets/ZeroPlay-2.2.5.6-Android-Lite.apk \
            release-assets/ZeroPlay-2.2.5.6-Android-TV-Lite.apk \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ZeroPlay v2.2.5.6 — Android Native Live PPV Playback Fix' \
            --notes-file docs/releases/v2.2.5.6.md \
            --latest=false
          gh release view v2.2.5.6 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
