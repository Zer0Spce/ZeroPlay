name: ZeroPlay 2.2.5.1 Android Live PPV Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-2.2.5.1.yml'
      - 'release-2.2.5.1-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeroplay-2-2-5-1-android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply the existing stable 2.2.5 Android stack, then version as 2.2.5.1
        run: |
          set -euo pipefail
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node tests/audio-boost-2.2.4.1.test.cjs
          node scripts/apply-custom-livetv-test.cjs
          node - <<'NODE'
          const fs=require('fs');
          const file='app/build.gradle';
          let source=fs.readFileSync(file,'utf8');
          if(!source.includes("versionName '2.2.5-test1'") || !source.includes('versionCode 51')) throw Error('Expected stable 2.2.5 Android stack');
          source=source.replace("versionName '2.2.5-test1'","versionName '2.2.5.1'");
          source=source.replace('versionCode 51','versionCode 54');
          fs.writeFileSync(file,source);
          NODE

      - name: Verify exact hotfix version and stable Live TV baseline
        run: |
          set -euo pipefail
          grep -q "versionName '2.2.5.1'" app/build.gradle
          grep -q 'versionCode 54' app/build.gradle
          grep -q 'LivePpvPlayback.headers' app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
          grep -q 'LivePpvPlayback.nextSameEvent' app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
          grep -q 'livePpv?LivePpvPlayback.headers' app/src/main/java/com/zerostreams/app/LivePlayerActivity.java
          grep -q 'Load M3U from file' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'Restore original playlist' app/src/main/java/com/zerostreams/app/MainActivity.java
          node tests/audio-boost-2.2.4.test.cjs
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs

      - name: Unit tests for Android and Android TV
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest

      - name: Build and verify signed 2.2.5.1 APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-2.2.5.1-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease
          mkdir -p release-builds
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk release-builds/ZeroPlay-2.2.5.1-Android.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk release-builds/ZeroPlay-2.2.5.1-Android-TV.apk
          for apk in release-builds/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionName='2.2.5.1'"
          done

      - name: Lint Android and Android TV
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.5.1-Android-APKs
          path: release-builds/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.5.1-Android-APKs
          path: release-assets
      - name: Verify and checksum Android release assets
        run: |
          set -euo pipefail
          cd release-assets
          test -s ZeroPlay-2.2.5.1-Android.apk
          test -s ZeroPlay-2.2.5.1-Android-TV.apk
          sha256sum ZeroPlay-2.2.5.1-Android.apk ZeroPlay-2.2.5.1-Android-TV.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish 2.2.5.1 Android hotfix release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.5.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v2.2.5.1 already exists; refusing to overwrite.'
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## ZeroPlay 2.2.5.1 — Android Live PPV Playback Fix

          **Android and Android TV hotfix.** Windows remains at 2.2.5 and is unchanged.

          - Tries the original Live PPV stream with its published request headers first.
          - Adds browser-compatible HTTP request fallback profiles for HLS playback network failures.
          - Tries an untested alternate feed only for the **same Live PPV event** when another direct HLS URL is listed.
          - Displays a network/HTTP failure summary if playback still cannot connect.
          - No changes to Live TV/IPTV, Live Sports, Movies, Series, audio booster, Windows, or the existing stable tag v2.2.5.
          - Does not bypass DRM, authentication, paywalls, or provider access controls.

          Version: **2.2.5.1** (Android versionCode **54**).

          Android/Android TV unit tests, build checks, signing verification, and lint were run in the release workflow.

          Note: Individual CDN links can still be unavailable, expired, geo-restricted, or incompatible with a specific Android device. Successful CI does not prove playback on every device.

          Included: signed Android APK, signed Android TV APK, SHA256 checksums.
          EOF
          gh release create v2.2.5.1 \
            release-assets/ZeroPlay-2.2.5.1-Android.apk \
            release-assets/ZeroPlay-2.2.5.1-Android-TV.apk \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ZeroPlay 2.2.5.1 — Android Live PPV Playback Hotfix' \
            --notes-file release-notes.md \
            --latest
