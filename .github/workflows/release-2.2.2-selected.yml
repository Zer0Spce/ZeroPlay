name: ZeroPlay 2.2.2 Selected Platform Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: zeroplay-2-2-2-selected
  cancel-in-progress: false

jobs:
  android:
    if: contains(github.event.head_commit.message, 'Ship ZeroPlay 2.2.2 selected platforms')
    name: Android TV + Lite Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android 2.2.2 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 46" app/build.gradle
          grep -q "versionName '2.2.2'" app/build.gradle
          grep -q 'ZXCStream (Beta)' app/src/main/java/com/zerostreams/app/PlaybackSources.java
          grep -q 'zxcstream.cc' app/src/main/java/com/zerostreams/app/PlaybackSources.java
          grep -q 'vidstuck.cc' app/src/main/java/com/zerostreams/app/PlaybackSources.java
          grep -q 'Default video source' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'putString("playbackSource"' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -R 'vidstuck.xyz' app --exclude-dir=build && exit 1 || true

      - name: Player/source regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs
          npm install --prefix /tmp/zero-release-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-release-tests/node_modules node tests/tv-navigation.test.cjs
          ZERO_GUARD_PATH=app/src/main/assets/player-guard.js NODE_PATH=/tmp/zero-release-tests/node_modules node tests/player-guard.test.cjs

      - name: Unit tests — selected Android variants
        run: gradle :app:testTvReleaseUnitTest :app:testLiteMobileReleaseUnitTest :app:testLiteTvReleaseUnitTest

      - name: Build signed selected APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleTvRelease :app:assembleLiteMobileRelease :app:assembleLiteTvRelease
          tv=app/build/outputs/apk/tv/release/app-tv-release.apk
          liteMobile=app/build/outputs/apk/liteMobile/release/app-liteMobile-release.apk
          liteTv=app/build/outputs/apk/liteTv/release/app-liteTv-release.apk
          for apk in "$tv" "$liteMobile" "$liteTv"; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionName='2.2.2'"
          done
          mkdir -p release-assets
          cp "$tv" release-assets/ZeroPlay-2.2.2-Android-TV.apk
          cp "$liteMobile" release-assets/ZeroPlay-2.2.2-Android-Lite.apk
          cp "$liteTv" release-assets/ZeroPlay-2.2.2-Android-TV-Lite.apk

      - name: Lint selected Android variants
        run: gradle --continue :app:lintTvRelease :app:lintLiteMobileRelease :app:lintLiteTvRelease

      - name: Audit Android production assets
        run: python scripts/audit-release-secrets.py release-assets app/src

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.2-Android-Selected
          path: release-assets/*.apk
          if-no-files-found: error
          compression-level: 0

  windows:
    if: contains(github.event.head_commit.message, 'Ship ZeroPlay 2.2.2 selected platforms')
    name: Windows Portable Production
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve committed line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        working-directory: windows
        run: npm ci --no-audit --no-fund

      - name: Normalize and run Windows regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node scripts/fix-2.2-windows-regression-tests.cjs
          if($LASTEXITCODE -ne 0){throw 'Windows 2.2 regression normalizer failed'}
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs
          node tests/windows-home-panel-order.test.cjs
          node tests/windows-upnext-items-dedupe.test.cjs
          Push-Location windows
          npm test
          if($LASTEXITCODE -ne 0){throw 'Windows unit tests failed'}
          npm install --prefix ../ui-test-deps --no-audit --no-fund jsdom@24.1.3
          $env:NODE_PATH="${{ github.workspace }}\ui-test-deps\node_modules"
          foreach($script in @('scripts/ui-check.cjs','scripts/experience-check.cjs','scripts/layout-check.cjs','scripts/live-compat-check.cjs','scripts/player-exit-check.cjs')){
            node $script
            if($LASTEXITCODE -ne 0){throw "Desktop regression failed: $script"}
          }
          npx electron scripts/media-check.cjs
          if($LASTEXITCODE -ne 0){throw 'Media regression failed'}
          node scripts/tmdb-check.cjs
          if($LASTEXITCODE -ne 0){throw 'TMDB regression failed'}
          $env:ZERO_GUARD_PATH='assets/player-guard.js'
          node ../tests/player-guard.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Player guard regression failed'}
          $ui=Get-Content ui/app.js -Raw
          if($ui -notmatch "\['zxcstream','ZXCStream \(Beta\)'\]"){throw 'ZXCStream missing from desktop source picker'}
          if($ui -notmatch "state\?\.settings\?\.source"){throw 'Global default source logic missing'}
          Pop-Location

      - name: Configure bundled production keys/vendors
        working-directory: windows
        run: npm run prepare-config

      - name: Download pinned mpv x64 engine
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261009/mpv-x86_64-20261009-git-36abaa32d0.7z'
          $expected='9afbe74f4ab885ca512769f8835758eb66b7b8a5ea6d679500588f8e7fec632e'
          Invoke-WebRequest -Uri $url -OutFile mpv.7z
          $actual=(Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "mpv SHA-256 mismatch: $actual"}
          New-Item -ItemType Directory -Force vendor/mpv | Out-Null
          7z x mpv.7z -ovendor/mpv -y | Out-Host
          $mpv=Get-ChildItem vendor/mpv -Filter mpv.exe -Recurse | Select-Object -First 1
          if(-not $mpv){throw 'mpv.exe missing after extraction'}
          if($mpv.Directory.FullName -ne (Resolve-Path vendor/mpv).Path){Copy-Item "$($mpv.Directory.FullName)/*" vendor/mpv -Recurse -Force}
          if(!(Test-Path vendor/mpv/mpv.exe)){throw 'mpv.exe normalization failed'}
          Remove-Item mpv.7z -Force

      - name: Apply preserved production Windows stack
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('scripts/apply-offline-mpv-test.cjs','scripts/apply-final-windows-polish.cjs','scripts/apply-episode-progress-fix.cjs','scripts/apply-windows-episode-completion-fix.cjs','scripts/fix-final-windows-action-tdz.cjs','scripts/apply-2.1.2-player-adblock.cjs')){
            node $script
            if($LASTEXITCODE -ne 0){throw "Production stack failed: $script"}
          }
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version='2.2.2'
          $pkg.build.buildVersion='2.2.2'
          $pkg.build.win.artifactName='ZeroPlay-2.2.2-Windows-x64.${ext}'
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8
          node --check main.cjs
          node --check ui/app.js
          node --check ui/home-visuals.js

      - name: Build native video host and updater
        shell: pwsh
        working-directory: windows
        run: |
          dotnet publish mpv-host-helper/MpvVideoHost.csproj -c Release -r win-x64 --self-contained true -o mpv-host-helper/publish
          Copy-Item mpv-host-helper/publish/MpvVideoHost.exe ./MpvVideoHost.exe -Force
          dotnet publish updater-helper/ZeroPlayUpdater.csproj -c Release -r win-x64 --self-contained true -o updater-helper/publish
          Copy-Item updater-helper/publish/ZeroPlayUpdater.exe ./ZeroPlayUpdater.exe -Force
          if(!(Test-Path MpvVideoHost.exe)){throw 'MpvVideoHost.exe missing'}
          if(!(Test-Path ZeroPlayUpdater.exe)){throw 'ZeroPlayUpdater.exe missing'}

      - name: Verify transformed Windows source
        shell: pwsh
        working-directory: windows
        run: |
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          $main=Get-Content main.cjs -Raw
          $ui=Get-Content ui/app.js -Raw
          $sources=Get-Content playback-sources.cjs -Raw
          if($pkg.version -ne '2.2.2'){throw 'Expected Windows version 2.2.2'}
          if($sources -notmatch 'zxcstream.cc'){throw 'ZXCStream domain missing after production transforms'}
          if($sources -notmatch 'ZXCStream \(Beta\)'){throw 'ZXCStream source missing after production transforms'}
          if($sources -match 'vidstuck.xyz'){throw 'Old VidStuck domain remains'}
          if($sources -notmatch 'vidstuck.cc'){throw 'VidStuck .cc domain missing'}
          if($ui -notmatch "state\?\.settings\?\.source"){throw 'Global default source setting missing'}
          if($main -notmatch 'autoSourceRecovery'){throw '2.2 source recovery logic missing'}
          if($main -notmatch 'MpvOfflinePlayer'){throw 'Production mpv offline player missing'}
          if($main -notmatch 'contents\.session\.webRequest\.onBeforeRequest'){throw 'Production request filtering missing'}

      - name: Electron smoke test
        timeout-minutes: 9
        shell: pwsh
        working-directory: windows
        run: |
          npx electron . --smoke-test
          if($LASTEXITCODE -ne 0){throw "Electron smoke test failed: $LASTEXITCODE"}

      - name: Build portable Windows ZIP
        working-directory: windows
        run: npx electron-builder --win --x64 --publish never

      - name: Verify portable production package
        shell: pwsh
        working-directory: windows
        run: |
          $zip='dist/ZeroPlay-2.2.2-Windows-x64.zip'
          if(!(Test-Path $zip)){throw 'Windows 2.2.2 portable ZIP was not created'}
          if(!(Test-Path 'dist/win-unpacked/ZeroPlay.exe')){throw 'ZeroPlay.exe missing'}
          if(!(Test-Path 'dist/win-unpacked/ZeroPlayUpdater.exe')){throw 'ZeroPlayUpdater.exe missing'}
          if(!(Test-Path 'dist/win-unpacked/resources/mpv/mpv.exe')){throw 'Bundled mpv.exe missing'}
          if(!(Test-Path 'dist/win-unpacked/resources/mpv-host/MpvVideoHost.exe')){throw 'Native mpv host missing'}
          $verify='dist/verify-asar'
          if(Test-Path $verify){Remove-Item $verify -Recurse -Force}
          npx --yes @electron/asar extract 'dist/win-unpacked/resources/app.asar' $verify
          $pkg=Get-Content "$verify/package.json" -Raw | ConvertFrom-Json
          $sources=Get-Content "$verify/playback-sources.cjs" -Raw
          if($pkg.version -ne '2.2.2'){throw 'Packaged version mismatch'}
          if($sources -notmatch 'zxcstream.cc'){throw 'Packaged ZXCStream missing'}
          if($sources -match 'vidstuck.xyz'){throw 'Old VidStuck domain packaged'}
          Remove-Item $verify -Recurse -Force

      - name: Audit Windows production credentials
        run: python scripts/audit-release-secrets.py windows/dist/ZeroPlay-2.2.2-Windows-x64.zip windows/dist/win-unpacked

      - name: Microsoft Defender scan
        shell: pwsh
        working-directory: windows
        run: |
          $scanner=(Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if(-not $scanner){throw 'Microsoft Defender scanner unavailable; release blocked'}
          & $scanner -Scan -ScanType 3 -File "$pwd\dist\win-unpacked" -DisableRemediation
          if($LASTEXITCODE -ne 0){throw "Defender scan failed or detected a threat (exit $LASTEXITCODE); release blocked"}

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.2-Windows-Selected
          path: windows/dist/ZeroPlay-2.2.2-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: contains(github.event.head_commit.message, 'Ship ZeroPlay 2.2.2 selected platforms')
    name: Publish ZeroPlay 2.2.2 Selected Platforms
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.2-Android-Selected
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.2-Windows-Selected
          path: release-assets
      - name: Final asset audit and checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in ZeroPlay-2.2.2-Android-TV.apk ZeroPlay-2.2.2-Android-Lite.apk ZeroPlay-2.2.2-Android-TV-Lite.apk ZeroPlay-2.2.2-Windows-x64.zip; do test -f "release-assets/$file"; done
          python scripts/audit-release-secrets.py release-assets
          cd release-assets
          sha256sum ZeroPlay-2.2.2-Android-TV.apk ZeroPlay-2.2.2-Android-Lite.apk ZeroPlay-2.2.2-Android-TV-Lite.apk ZeroPlay-2.2.2-Windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish ZeroPlay 2.2.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.2.2 >/dev/null 2>&1; then echo 'v2.2.2 already exists; refusing overwrite'; exit 1; fi
          gh release create v2.2.2 \
            release-assets/ZeroPlay-2.2.2-Android-TV.apk \
            release-assets/ZeroPlay-2.2.2-Android-Lite.apk \
            release-assets/ZeroPlay-2.2.2-Android-TV-Lite.apk \
            release-assets/ZeroPlay-2.2.2-Windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'ZeroPlay 2.2.2 — Playback Source Refresh' \
            --notes-file docs/release-2.2.2.md \
            --latest
