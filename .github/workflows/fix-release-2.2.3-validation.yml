name: Fix ZeroPlay 2.2.3 release validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-release-2.2.3-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct web validation target and trigger release
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/release-2.2.3.yml
          grep -q 'web/dist' "$file"
          sed -i 's#web/dist#web/public#g' "$file"
          grep -q "grep -R -q 'zxcstream.cc' web/public" "$file"
          grep -q "grep -R -q 'vidstuck.cc' web/public" "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'Publish ZeroPlay v2.2.3 — fix web validation'
          git push origin HEAD:main
