name: Capture genuine ZeroPlay 2.2 screenshots
on:
  push:
    branches: [docs/zeroplay-2.2-gallery]
    paths: [.github/workflows/gallery-2.2.yml, scripts/capture-release-gallery.cjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download published Windows 2.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v2.2 --pattern ZeroPlay-2.2-Windows-x64.zip --dir gallery-release
          gh release download v2.2 --pattern SHA256SUMS.txt --dir gallery-release
          $line=Get-Content gallery-release/SHA256SUMS.txt | Where-Object { $_ -match 'ZeroPlay-2.2-Windows-x64.zip$' }
          if(-not $line){throw 'Published checksum missing'}
          $expected=($line -split '\s+')[0]
          if((Get-FileHash gallery-release/ZeroPlay-2.2-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() -ne $expected){throw 'Release checksum mismatch'}
          Expand-Archive gallery-release/ZeroPlay-2.2-Windows-x64.zip gallery-release/app
      - name: Capture released application
        shell: pwsh
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          $exe=Get-ChildItem gallery-release/app -Recurse -Filter ZeroPlay.exe | Select-Object -First 1
          if(-not $exe){throw 'Published executable missing'}
          $process=Start-Process $exe.FullName -ArgumentList '--remote-debugging-port=9222' -PassThru
          try { node scripts/capture-release-gallery.cjs; if($LASTEXITCODE -ne 0){throw 'Capture failed'} }
          finally { Get-Process ZeroPlay -ErrorAction SilentlyContinue | Stop-Process -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-windows-2.2
          path: docs/screenshots/2.2/*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Mobile
            density: 420
            profile: pixel_2
          - variant: Tv
            density: 240
            profile: tv_1080p
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            adb shell wm size reset
            adb shell wm density ${{ matrix.density }}
            gradle :app:connected${{ matrix.variant }}DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.zerostreams.app.GalleryTest
            mkdir -p docs/screenshots/2.2
            variant=$(echo '${{ matrix.variant }}' | tr '[:upper:]' '[:lower:]'); for name in home categories live-sports settings home-panels layout-google layout-classic layout-youtube; do adb pull "/data/local/tmp/zeroplay-$name.png" "docs/screenshots/2.2/android-$variant-$name.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-android-${{ matrix.variant }}-2.2
          path: docs/screenshots/2.2/*.png
          if-no-files-found: error
  preserve:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: gallery-*-2.2
          path: docs/screenshots/2.2
          merge-multiple: true
      - name: Preserve genuine captures on documentation branch
        env:
          GALLERY_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'ZeroPlay'
          git config user.email 'zeroplay@users.noreply.github.com'
          git add docs/screenshots/2.2
          git commit -m 'Add genuine released Windows and native Android 2.2 captures'
          git push origin "HEAD:$GALLERY_BRANCH"
