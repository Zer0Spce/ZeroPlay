name: ZeroPlay VPN DNS Android + TV SIDE-BY-SIDE QA — TEST ONLY
on:
  push:
    branches: [test/vpn-adblock-mode-android-tv]
  workflow_dispatch:
permissions:
  contents: read
jobs:

  original-blockads-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Get exact upstream BlockAds source and verify license
        run: |
          set -euo pipefail
          git init blockads-upstream
          git -C blockads-upstream remote add origin https://github.com/pass-with-high-score/blockads-android.git
          git -C blockads-upstream fetch --depth=1 origin 40bf7c959ed23dd3dcf3cb8577dc1b027c29c946
          git -C blockads-upstream checkout --detach FETCH_HEAD
          test "$(git -C blockads-upstream rev-parse HEAD)" = "40bf7c959ed23dd3dcf3cb8577dc1b027c29c946"
          grep -F 'GNU GENERAL PUBLIC LICENSE' blockads-upstream/LICENSE
          test -f blockads-upstream/blockadstv/src/main/java/app/pwhs/blockadstv/service/GoTunnelAdapter.kt
          test -f blockads-upstream/blockadstv/src/main/java/app/pwhs/blockadstv/service/TvVpnService.kt
          test -f blockads-upstream/blockadstv/src/main/java/app/pwhs/blockadstv/data/repository/FilterListRepository.kt
          test -f blockads-upstream/gradle/tunnel.aar.sha256
      - name: Apply minimal integration patch to actual upstream app
        run: python3 scripts/prepare-blockads-upstream-companion.py blockads-upstream
      - name: Compile original upstream BlockAds Android + TV engines
        working-directory: blockads-upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleGithubDebug :blockadstv:assembleGithubDebug
      - name: Verify upstream app identity and genuine Go tunnel packaged
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          mkdir -p blockads-qa-apks
          for kind in app blockadstv; do
            apk="$(find blockads-upstream/$kind/build/outputs/apk/github/debug -name '*.apk' | head -1)"
            test -n "$apk" && test -s "$apk"
            "$AAPT" dump badging "$apk" | grep -F "package: name='app.pwhs.blockads.zeroplayqa'"
            unzip -l "$apk" | grep -F 'libgojni.so'
            cp "$apk" "blockads-qa-apks/BlockAds-Upstream-$kind-ZeroPlay-TEST.apk"
          done
      - name: Upload real BlockAds companion APKs (GPLv3; no release)
        uses: actions/upload-artifact@v4
        with:
          name: Genuine-BlockAds-ZeroPlay-Companion-TEST
          path: blockads-qa-apks/*.apk
          retention-days: 5
          if-no-files-found: error
  vpn-adblock-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify VPN service, player source and toggle scope
        run: |
          node --test tests/zeroplay-real-blockads.test.cjs
          node --test tests/zeroplay-vpn-isolated-identity.test.cjs
          node --test tests/zeroplay-2269-vidstuck-default.test.cjs
          node --test tests/zeroplay-2267-mapple-guard.test.cjs
          node --test tests/source-selection-regression.test.cjs
      - name: Require actual catalog API keys for the standalone first-launch build
        run: |
          test -n "$TMDB_API_KEY" || { echo "Missing TMDB_API_KEY for QA build"; exit 1; }
          test -n "$OMDB_API_KEY" || { echo "Missing OMDB_API_KEY for QA build"; exit 1; }
      - name: Prepare original Android app baseline
        run: |
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node scripts/apply-custom-livetv-test.cjs
      - name: Run Android Mobile, TV, Lite Java unit tests
        run: gradle -PzeroVpnQaIsolated=true :app:testMobileDebugUnitTest :app:testTvDebugUnitTest :app:testLiteMobileDebugUnitTest :app:testLiteTvDebugUnitTest
      - name: Compile four unsigned QA-only APKs
        run: gradle -PzeroVpnQaIsolated=true :app:assembleMobileDebug :app:assembleTvDebug :app:assembleLiteMobileDebug :app:assembleLiteTvDebug
      - name: Verify APK package IDs and launcher labels cannot replace the current release
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          for edition in mobile tv liteMobile liteTv; do
            apk="app/build/outputs/apk/$edition/debug/app-$edition-debug.apk"
            test -s "$apk"
            case "$edition" in
              mobile) expected='com.zerostreams.app.mobile.vpntest'; label='ZeroPlay VPN Test' ;;
              tv) expected='com.zerostreams.app.tv.vpntest'; label='ZeroPlay VPN Test' ;;
              liteMobile) expected='com.zerostreams.app.lite.mobile.vpntest'; label='ZeroPlay VPN Test Lite' ;;
              liteTv) expected='com.zerostreams.app.lite.tv.vpntest'; label='ZeroPlay VPN Test Lite' ;;
            esac
            badging="$("$AAPT" dump badging "$apk")"
            printf '%s\\n' "$badging" | grep -F "package: name='$expected'"
            printf '%s\\n' "$badging" | grep -F "application-label:'$label'"
            ! printf '%s\\n' "$badging" | grep -E "package: name='com\\.zerostreams\\.app\\.(mobile|tv|lite\\.mobile|lite\\.tv)'"
            echo "$edition is isolated from production: $expected ($label)"
          done
      - name: Upload temporary internal QA packages; no release
        uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-VPN-TEST-SIDE-BY-SIDE-NO-OVERWRITE
          path: |
            app/build/outputs/apk/mobile/debug/*.apk
            app/build/outputs/apk/tv/debug/*.apk
            app/build/outputs/apk/liteMobile/debug/*.apk
            app/build/outputs/apk/liteTv/debug/*.apk
          if-no-files-found: error
          retention-days: 5
