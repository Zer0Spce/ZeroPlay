name: Fix ZeroPlay 2.2 Source Selection
on:
  push:
    branches:
      - feature/2.2-navigation-discovery-performance
    paths:
      - '.github/workflows/fix-2.2-source-selection.yml'
      - 'scripts/fix-2.2-source-selection.cjs'
permissions:
  contents: write
concurrency:
  group: zeroplay-2-2-source-selection-fix
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted source-selection fix
        run: node scripts/fix-2.2-source-selection.cjs
      - name: Verify source-selection regression
        run: |
          node --test tests/source-selection-regression.test.cjs
          node --check windows/main.cjs
          node --check windows/ui/app.js
          git diff --check
      - name: Commit corrected sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/main.cjs windows/ui/app.js app/src/main/java/com/zerostreams/app/MainActivity.java tests/source-selection-regression.test.cjs
          git diff --cached --exit-code && exit 0
          git commit -m 'Fix 2.2 manual playback source precedence'
          git push origin HEAD:feature/2.2-navigation-discovery-performance
