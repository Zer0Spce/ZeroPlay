name: Remove ZeroPlay Player Overlay
on:
  push:
    branches:
      - feature/2.2-navigation-discovery-performance
    paths:
      - '.github/workflows/fix-2.2-source-selection.yml'
      - 'scripts/fix-2.2-source-selection.cjs'
permissions:
  contents: write
concurrency:
  group: zeroplay-2-2-player-overlay-fix
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove custom playback overlays
        run: node scripts/fix-2.2-source-selection.cjs
      - name: Verify provider-default player controls
        run: |
          node --test tests/default-player-controls-regression.test.cjs
          node --check windows/player-host.cjs
          git diff --check
      - name: Commit overlay removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/player-host.cjs app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java tests/default-player-controls-regression.test.cjs
          git diff --cached --exit-code && exit 0
          git commit -m 'Keep provider default player controls'
          git push origin HEAD:feature/2.2-navigation-discovery-performance
