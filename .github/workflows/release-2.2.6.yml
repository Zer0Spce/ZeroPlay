name: ZeroPlay 2.2.6 — Full Production Release
# Revalidated both isolated QA and established signed production Android app IDs.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-2.2.6.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeroplay-2260-official-release
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve stable native Live PPV and Android TV navigation
        run: |
          set -euo pipefail
          node --test tests/android-native-live-ppv-v2.2.5.6.test.cjs
          node tests/android-tv-source-navigation-2.2.5.4.test.cjs
          node tests/default-player-controls-regression.test.cjs
          node tests/source-selection-regression.test.cjs
      - name: Apply existing Android feature stack and version 2.2.5.7 code 62
        run: |
          set -euo pipefail
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node tests/audio-boost-2.2.4.1.test.cjs
          node scripts/apply-custom-livetv-test.cjs
          node - <<'NODE'
          const fs=require('node:fs'),file='app/build.gradle';let s=fs.readFileSync(file,'utf8');
          if(!s.includes("versionName '2.2.5-test1'")||!s.includes('versionCode 51'))throw Error('Unexpected baseline');
          s=s.replace("versionName '2.2.5-test1'","versionName '2.2.6'");
          s=s.replace('versionCode 51','versionCode 65');
          fs.writeFileSync(file,s);
          NODE
          node --test tests/android-native-live-ppv-v2.2.5.6.test.cjs
      - name: Render original wide streaming-provider logos for all Android APKs
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zeroplay-logo-venv"
          "$RUNNER_TEMP/zeroplay-logo-venv/bin/python" -m pip install --disable-pip-version-check -q CairoSVG==2.7.1
          "$RUNNER_TEMP/zeroplay-logo-venv/bin/python" scripts/render-provider-wordmarks.py
          test "$(find app/src/main/assets/provider-logos -maxdepth 1 -name '*.png' | wc -l)" -eq 8
      - name: Test Discovery 2.0 and Zero Crimson integration
        run: |
          node --check windows/ui/fresh-recommendations.js
          node --check windows/ui/fresh-home.js
          node --check windows/ui/app.js
          node --test tests/zeroplay-smart-home-2258.test.cjs
          node --test tests/zeroplay-2260-final-polish.test.cjs
      - name: Run full and Lite Android unit tests
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest :app:testLiteMobileReleaseUnitTest :app:testLiteTvReleaseUnitTest
      - name: Build and verify signed four public Android APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-2.2.5.7.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease :app:assembleLiteMobileRelease :app:assembleLiteTvRelease
          mkdir -p release-builds
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk release-builds/ZeroPlay-2.2.6-Android.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk release-builds/ZeroPlay-2.2.6-Android-TV.apk
          cp app/build/outputs/apk/liteMobile/release/app-liteMobile-release.apk release-builds/ZeroPlay-2.2.6-Android-Lite.apk
          cp app/build/outputs/apk/liteTv/release/app-liteTv-release.apk release-builds/ZeroPlay-2.2.6-Android-TV-Lite.apk
          test "$(find release-builds -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          for apk in release-builds/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionCode='65'"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionName='2.2.6'"
            actual_id=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
            case "$(basename "$apk")" in
              ZeroPlay-2.2.6-Android.apk) expected_id='com.zerostreams.app.mobile' ;;
              ZeroPlay-2.2.6-Android-TV.apk) expected_id='com.zerostreams.app.tv' ;;
              ZeroPlay-2.2.6-Android-Lite.apk) expected_id='com.zerostreams.app.lite.mobile' ;;
              ZeroPlay-2.2.6-Android-TV-Lite.apk) expected_id='com.zerostreams.app.lite.tv' ;;
              *) echo 'Unexpected Android APK name'; exit 1 ;;
            esac
            test "$actual_id" = "$expected_id" || { echo "Production package ID mismatch: $actual_id (expected $expected_id)"; exit 1; }
            case "$expected_id" in
              *.lite.*) expected_label='ZeroPlay Lite' ;;
              *) expected_label='ZeroPlay' ;;
            esac
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "application-label:'$expected_label'"
          done
      - name: Android lint for all public editions
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease :app:lintLiteMobileRelease :app:lintLiteTvRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.6-Android
          path: release-builds/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows:
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      ZERO_2260_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Windows dependencies
        working-directory: windows
        run: npm ci --no-audit --no-fund
      - name: Render approved playmark at Windows required 256px icon size
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $sourcePath=(Resolve-Path windows/assets/zeroplay-app-icon.png).Path
          $assets=(Resolve-Path windows/assets).Path
          $source=[System.Drawing.Image]::FromFile($sourcePath)
          try {
            foreach ($size in @(16,24,32,48,64,128,256)) {
              $destPath=Join-Path $assets "zeroplay-app-icon-$size.png"
              $target=[System.Drawing.Bitmap]::new($size,$size,[System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              $graphics=[System.Drawing.Graphics]::FromImage($target)
              try {
                $graphics.Clear([System.Drawing.Color]::Transparent)
                $graphics.InterpolationMode=[System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $graphics.CompositingQuality=[System.Drawing.Drawing2D.CompositingQuality]::HighQuality
                $graphics.SmoothingMode=[System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                $graphics.DrawImage($source,0,0,$size,$size)
                $target.Save($destPath,[System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $graphics.Dispose()
                $target.Dispose()
              }
              if ((Get-Item $destPath -ErrorAction Stop).Length -lt 200) { throw "Windows $size px icon rendering failed" }
            }
          } finally {
            $source.Dispose()
          }
      - name: Verify v2.2.5.7 source and prepare 2.2.6 production package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Baseline commit already contains 2.2.5.7 Windows source changes.
          # Do NOT reapply legacy scripts: they target older pre-release markers.
          node --test windows/test/smart-status-2.2.5.7.test.cjs
          if ($LASTEXITCODE -ne 0) { throw '2.2.5.7 source verification failed' }
          node scripts/prepare-2260-windows-release.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows production package preparation failed' }
          node -e "if(require('./windows/version-manager.cjs').publicVersion('2.2.5-9')!=='2.2.6')throw Error('Production version mapping failed')"
          if ($LASTEXITCODE -ne 0) { throw 'Production version check failed' }
      - name: Test Discovery 2.0 and Zero Crimson branding
        shell: pwsh
        run: |
          node --check windows/ui/fresh-recommendations.js
          if ($LASTEXITCODE -ne 0) { throw 'Discovery JS syntax check failed' }
          node --check windows/ui/fresh-home.js
          if ($LASTEXITCODE -ne 0) { throw 'Home integration syntax check failed' }
          node --check windows/ui/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Windows UI syntax check failed' }
          node --test tests/zeroplay-smart-home-2258.test.cjs
          node --test tests/zeroplay-2260-final-polish.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Recommendation tests failed' }
      - name: Run all Windows and Smart Stream Status regressions
        working-directory: windows
        run: |
          npm test
          node --test test/smart-status-2.2.5.7.test.cjs
          node -e "const fs=require('fs'),s=fs.readFileSync('main.cjs','utf8');if(!s.includes('2\\.2\\.6$/.test(result.version)'))throw Error('Packaged UI smoke must expect version 2.2.6')"
      - name: Build self-contained visible ZeroPlayUpdater.exe
        shell: pwsh
        run: |
          dotnet publish windows/updater-helper/ZeroPlayUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o windows/updater-publish
          Copy-Item windows/updater-publish/ZeroPlayUpdater.exe windows/ZeroPlayUpdater.exe -Force
          $helper = Get-Item windows/ZeroPlayUpdater.exe -ErrorAction Stop
          if ($helper.Length -lt 1000000) { throw 'Standalone updater helper unexpectedly small' }
          Write-Host "ZeroPlayUpdater.exe built: $($helper.Length) bytes"
      - name: Package Windows x64 ZIP including updater
        working-directory: windows
        shell: pwsh
        run: |
          npm run build -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'electron-builder failed' }

      - name: Check actual Windows ZIP contains separate updater helper
        shell: pwsh
        run: |
          $helper = Get-Item windows/dist/win-unpacked/ZeroPlayUpdater.exe -ErrorAction Stop
          if($helper.Length -lt 1000000){throw 'Updater not packaged beside ZeroPlay.exe'}
          $zip = Get-Item windows/dist/ZeroPlay-2.2.6-Windows-x64.zip -ErrorAction Stop
          if($zip.Length -lt 5000000){throw 'Windows portable ZIP missing or empty'}
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if(-not ($names | Where-Object { $_ -match '(^|/)ZeroPlayUpdater[.]exe$' })){throw 'ZIP missing ZeroPlayUpdater.exe'}
            if(-not ($names | Where-Object { $_ -match '(^|/)ZeroPlay[.]exe$' })){throw 'ZIP missing ZeroPlay.exe'}
          } finally { $archive.Dispose() }
          Add-Type -AssemblyName System.Drawing
          $exe=(Get-Item windows/dist/win-unpacked/ZeroPlay.exe -ErrorAction Stop).FullName
          $embeddedIcon=[System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $embeddedIcon) { throw 'Windows executable has no embedded icon' }
          $bitmap=$embeddedIcon.ToBitmap()
          $red=0; $teal=0
          try {
            for($x=0;$x -lt $bitmap.Width;$x++){
              for($y=0;$y -lt $bitmap.Height;$y++){
                $pixel=$bitmap.GetPixel($x,$y)
                if($pixel.A -lt 90){continue}
                if($pixel.R -gt 110 -and $pixel.R -gt 1.45*$pixel.G -and $pixel.R -gt 1.35*$pixel.B){$red++}
                if($pixel.G -gt 90 -and $pixel.G -gt 1.3*$pixel.R -and $pixel.B -gt 1.1*$pixel.R){$teal++}
              }
            }
          } finally {$bitmap.Dispose();$embeddedIcon.Dispose()}
          if($red -lt 8 -or $red -le $teal){throw "ZeroPlay.exe still has the old teal/non-red icon: red=$red teal=$teal"}
          Write-Host "Verified red ZeroPlay icon EMBEDDED in ZeroPlay.exe: $red red pixels vs $teal teal pixels"
          Write-Host 'Windows ZIP includes both ZeroPlay.exe and standalone updater.'
      - name: Packaged Windows UI startup smoke
        shell: pwsh
        run: |
          $exe=(Get-Item windows/dist/win-unpacked/ZeroPlay.exe -ErrorAction Stop).FullName
          $process=Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test','--disable-gpu' -PassThru
          if(-not $process.WaitForExit(60000)){ $process.Kill(); throw 'ZeroPlay packaged UI startup timed out' }
          if($process.ExitCode -ne 0){ throw "ZeroPlay packaged UI failed with exit code $($process.ExitCode)" }
          Write-Host 'Packaged Windows 2.2.6 production startup passed.'
      - name: Copy verified Windows production ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/delivery | Out-Null
          Copy-Item windows/dist/ZeroPlay-2.2.6-Windows-x64.zip windows/delivery/ZeroPlay-2.2.6-Windows-x64.zip -Force
          (Get-FileHash windows/delivery/ZeroPlay-2.2.6-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content windows/delivery/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.6-Windows
          path: windows/delivery/ZeroPlay-2.2.6-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.6-Android
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.6-Windows
          path: release-assets
      - name: Validate four signed APKs and one Windows ZIP; generate SHA256SUMS
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          for file in ZeroPlay-2.2.6-Android.apk ZeroPlay-2.2.6-Android-TV.apk ZeroPlay-2.2.6-Android-Lite.apk ZeroPlay-2.2.6-Android-TV-Lite.apk ZeroPlay-2.2.6-Windows-x64.zip; do
            test -s "release-assets/$file"
          done
          (cd release-assets && sha256sum ./*.apk ./*.zip > SHA256SUMS.txt)
      - name: Publish verified ZeroPlay v2.2.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v2.2.6 already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v2.2.6 release-assets/*.apk release-assets/*.zip release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'ZeroPlay v2.2.6 — Playback Reliability & Discovery' \
            --notes-file docs/releases/v2.2.6.md --latest
