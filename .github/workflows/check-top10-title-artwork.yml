name: Preview Top 10 and title artwork
on:
  push:
    branches:
      - ui/top10-title-artwork
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cross-platform history and episode-memory fixes
        run: python scripts/fix-continue-resume-preview.py
      - name: Apply homepage curation and TV rank fixes
        run: python scripts/fix-home-curation-and-tv-ranks.py
      - name: Check patch quality
        run: git diff --check
      - name: Verify curated rows and uniform TV ranks
        shell: bash
        run: |
          grep -F 'private static double curationNoise(Catalog.Item item,long bucket)' app/src/main/java/com/zerostreams/app/Zero22.java
          grep -F 'int rankWidth=BuildConfig.TV?178:70' app/src/main/java/com/zerostreams/app/PresentationMainActivity.java
          grep -F 'Typeface face=Typeface.create("sans-serif-condensed",Typeface.BOLD)' app/src/main/java/com/zerostreams/app/PresentationMainActivity.java
          grep -F 'function zeroCurationMovies()' windows/ui/app.js
          grep -F 'curatedMovies=zeroCurationMovies(),hidden=zeroHiddenGems(curatedMovies),tonight=zeroTonight(curatedMovies)' windows/ui/app.js
          grep -F 'function zeroCurationMovies()' web/public/zero22.js
          grep -F 'curatedMovies=zeroCurationMovies(),hidden=zeroHiddenGems(curatedMovies),tonight=zeroTonight(curatedMovies)' web/public/zero22.js
      - name: Persist preview source fixes
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/com/zerostreams/app/MainActivity.java app/src/main/java/com/zerostreams/app/HistoryStore.java app/src/main/java/com/zerostreams/app/PresentationMainActivity.java app/src/main/java/com/zerostreams/app/Zero22.java windows/core.cjs windows/ui/app.js web/public/browser.js web/public/zero22.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/zerostreams/app/MainActivity.java app/src/main/java/com/zerostreams/app/HistoryStore.java app/src/main/java/com/zerostreams/app/PresentationMainActivity.java app/src/main/java/com/zerostreams/app/Zero22.java windows/core.cjs windows/ui/app.js web/public/browser.js web/public/zero22.js
            git commit -m "Preview: curate home picks and unify Android TV Top 10 ranks"
            git push origin HEAD:ui/top10-title-artwork
          fi

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply preview source fixes to this build
        run: |
          python scripts/fix-continue-resume-preview.py
          python scripts/fix-home-curation-and-tv-ranks.py
      - name: Verify Android mobile and TV episode memory
        shell: bash
        run: |
          grep -F 'rememberedSeason=prefs.getInt("resumeSeason:"+item.id,-1)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -F 'rememberedEpisode=season==prefs.getInt("resumeSeason:"+item.id,-1)?prefs.getInt("resumeEpisode:"+item.id,0):0' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -F 'setSingleChoiceItems(labels,preferredSeason' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -F 'setSingleChoiceItems(labels,preferredEpisode' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -F 'rankWidth=BuildConfig.TV?178:70' app/src/main/java/com/zerostreams/app/PresentationMainActivity.java
          grep -F 'overlap=BuildConfig.TV?116:58' app/src/main/java/com/zerostreams/app/PresentationMainActivity.java
          grep -F 'sans-serif-condensed' app/src/main/java/com/zerostreams/app/PresentationMainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
      - name: Build phone and TV debug APKs
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug
      - name: Lint phone and TV
        run: gradle --continue :app:lintMobileDebug :app:lintTvDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-Top10-Android-Preview
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Apply preview source fixes to this build
        working-directory: .
        run: |
          python scripts/fix-continue-resume-preview.py
          python scripts/fix-home-curation-and-tv-ranks.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Prepare bundled config
        run: npm run prepare-config
      - name: Electron smoke test
        run: npx electron . --smoke-test
      - name: Build portable ZIP
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-Top10-Windows-Preview
          path: windows/dist/ZeroPlay-*.zip
          if-no-files-found: error

  website:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply preview source fixes to this build
        run: |
          python scripts/fix-continue-resume-preview.py
          python scripts/fix-home-curation-and-tv-ranks.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Website tests
        run: node --test web/test/*.test.cjs
      - name: Website interaction checks
        run: |
          npm install --prefix /tmp/zero-web-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-web-tests/node_modules node web/scripts/ui-check.cjs
      - name: Validate website build
        run: node web/scripts/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-Web-Preview
          path: |
            web/public
            api
            vercel.json
          if-no-files-found: error
