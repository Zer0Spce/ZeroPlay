name: Preview Top 10 and title artwork
on:
  push:
    branches:
      - ui/top10-title-artwork
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare 2.2.1 release metadata
        run: python scripts/prepare-2.2.1-release.py
      - name: Keep committed production workflow
        run: git restore .github/workflows/release-2.2.1.yml
      - name: Apply final 2.2.1 Top 10 controls
        run: python scripts/finalize-2.2.1-top10.py
      - name: Apply Android TV Top 10 front-rank polish
        run: python scripts/fix-android-tv-top10-front-ranks.py
      - name: Check patch quality
        run: git diff --check
      - name: Verify 2.2.1 release candidate
        shell: bash
        run: |
          grep -F "versionCode 45" app/build.gradle
          grep -F "versionName '2.2.1'" app/build.gradle
          grep -F '"version": "2.2.1"' windows/package.json
          grep -F 'ZeroPlay-2.2.1-Windows-x64.${ext}' windows/package.json
          test -f docs/release-2.2.1.md
          test -f .github/workflows/release-2.2.1.yml
          grep -F 'Release ZeroPlay v2.2.1' .github/workflows/release-2.2.1.yml
          grep -F 'if(!homePanel("top10"))return;' app/src/main/java/com/zerostreams/app/PresentationMainActivity.java
          grep -F '"Top 10 today"' app/src/main/java/com/zerostreams/app/HomePanels.java
          grep -F "['top10','Top 10 today']" windows/ui/app.js
          grep -F 'window.zeroOpenDetails=async item' windows/ui/app.js
          grep -F 'zeroplay-top10-optout' windows/ui/home-visuals.js
          grep -F 'window.zeroOpenDetails?.(item)' windows/ui/home-visuals.js
          grep -F 'function zeroCurationMovies()' windows/ui/app.js
          grep -F 'function zeroCurationMovies()' web/public/zero22.js
      - name: Persist 2.2.1 release candidate
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              app/build.gradle \
              windows/package.json \
              README.md \
              docs/changelog.md \
              docs/release-2.2.1.md \
              app/src/main/java/com/zerostreams/app/HomePanels.java \
              app/src/main/java/com/zerostreams/app/PresentationMainActivity.java \
              app/src/test/java/com/zerostreams/app/HomePanelsTest.java \
              windows/main.cjs \
              windows/ui/app.js \
              windows/ui/home-visuals.js \
              windows/test/home-visuals.test.cjs
            if ! git diff --cached --quiet; then
              git commit -m "Prepare ZeroPlay 2.2.1 release candidate"
              git push origin HEAD:ui/top10-title-artwork
            fi
          fi

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare 2.2.1 release metadata
        run: python scripts/prepare-2.2.1-release.py
      - name: Apply final 2.2.1 Top 10 controls
        run: python scripts/finalize-2.2.1-top10.py
      - name: Apply Android TV Top 10 front-rank polish
        run: python scripts/fix-android-tv-top10-front-ranks.py
      - name: Verify Android mobile and TV final home state
        shell: bash
        run: |
          grep -F "versionName '2.2.1'" app/build.gradle
          grep -F 'rememberedSeason=prefs.getInt("resumeSeason:"+item.id,-1)' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -F 'rememberedEpisode=season==prefs.getInt("resumeSeason:"+item.id,-1)?prefs.getInt("resumeEpisode:"+item.id,0):0' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -F 'if(!homePanel("top10"))return;' app/src/main/java/com/zerostreams/app/PresentationMainActivity.java
          grep -F 'rankWidth=BuildConfig.TV?156:70' app/src/main/java/com/zerostreams/app/PresentationMainActivity.java
          grep -F 'overlap=BuildConfig.TV?132:58' app/src/main/java/com/zerostreams/app/PresentationMainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
      - name: Build phone and TV debug APKs
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug
      - name: Lint phone and TV
        run: gradle --continue :app:lintMobileDebug :app:lintTvDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.1-Android-Preview
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare 2.2.1 release metadata
        working-directory: ${{ github.workspace }}
        run: python scripts/prepare-2.2.1-release.py
      - name: Apply final 2.2.1 Top 10 controls
        working-directory: ${{ github.workspace }}
        run: python scripts/finalize-2.2.1-top10.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Prepare bundled config
        run: npm run prepare-config
      - name: Electron smoke test
        run: npx electron . --smoke-test
      - name: Build portable ZIP
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.1-Windows-Preview
          path: windows/dist/ZeroPlay-2.2.1-Windows-x64.zip
          if-no-files-found: error

  website:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Website tests
        run: node --test web/test/*.test.cjs
      - name: Website interaction checks
        run: |
          npm install --prefix /tmp/zero-web-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-web-tests/node_modules node web/scripts/ui-check.cjs
      - name: Validate website build
        run: node web/scripts/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.1-Web-Preview
          path: |
            web/public
            api
            vercel.json
          if-no-files-found: error
