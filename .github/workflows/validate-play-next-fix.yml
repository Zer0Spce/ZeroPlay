name: Validate Play Next Fix

on:
  push:
    branches:
      - fix/android-tv-lite-2.2.2-regressions
    paths:
      - '.github/workflows/validate-play-next-fix.yml'

permissions:
  contents: write

concurrency:
  group: validate-play-next-fix
  cancel-in-progress: true

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-tv-lite-2.2.2-regressions
          fetch-depth: 0
      - name: Harden Android episode navigation
        run: python3 scripts/fix-play-next-android.py
      - name: Verify generated diff
        shell: bash
        run: |
          git diff --check
          grep -Fq 'EpisodeNavigation.nextEpisode' app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
          grep -Fq '/(?:embed|player)/tv/' app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
          grep -Fq 'event.optInt("season",-1)' app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cross-platform Play Next regression
        run: node tests/source-selection-regression.test.cjs
      - name: Unit tests — all Android variants
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest :app:testLiteMobileDebugUnitTest :app:testLiteTvDebugUnitTest
      - name: Compile all Android variants
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug :app:assembleLiteMobileDebug :app:assembleLiteTvDebug
      - name: Lint shared phone and TV player paths
        run: gradle :app:lintMobileDebug :app:lintTvDebug
      - name: Commit validated player fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java
          if git diff --cached --quiet; then
            echo 'No player source changes to commit.'
            exit 0
          fi
          git commit -m 'Fix cross-Android Play Next episode resolver [skip ci]'
          git push origin HEAD:fix/android-tv-lite-2.2.2-regressions
