name: ZeroPlay Android Live Playback Diagnostics (Test APKs)
on:
  push:
    branches:
      - test/android-live-playback-diagnostics-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply stable 2.2.5 Android feature stack, test-version only
        run: |
          set -euo pipefail
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node scripts/apply-custom-livetv-test.cjs
          node - <<'NODE'
          const fs=require('fs');
          const file='app/build.gradle';
          let source=fs.readFileSync(file,'utf8');
          if (!source.includes("versionName '2.2.5-test1'")||!source.includes('versionCode 51')) throw Error('2.2.5 test stack changed unexpectedly');
          source=source.replace("versionName '2.2.5-test1'","versionName '2.2.5-live-diagnostic'");
          source=source.replace('versionCode 51','versionCode 52');
          fs.writeFileSync(file,source);
          NODE
      - name: Android + Android TV unit tests
        run: gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
      - name: Build Android + TV diagnostic APKs
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug
      - name: Copy debug APKs to artifacts
        run: |
          mkdir -p test-builds
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk test-builds/ZeroPlay-2.2.5-Live-Diagnostics-Android-debug.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk test-builds/ZeroPlay-2.2.5-Live-Diagnostics-Android-TV-debug.apk
      - name: Optionally build matching-key signed test updates
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo 'Signing secrets not configured: debug APKs only.'
            exit 0
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-diagnostic.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk test-builds/ZeroPlay-2.2.5-Live-Diagnostics-Android-signed.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk test-builds/ZeroPlay-2.2.5-Live-Diagnostics-Android-TV-signed.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose test-builds/ZeroPlay-2.2.5-Live-Diagnostics-Android-signed.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose test-builds/ZeroPlay-2.2.5-Live-Diagnostics-Android-TV-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-Android-Live-Playback-Diagnostics-Test
          path: test-builds/*.apk
          if-no-files-found: error
          retention-days: 14
