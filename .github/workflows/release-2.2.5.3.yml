name: ZeroPlay 2.2.5.3 Android Live PPV Controls Hotfix

on:
  push:
    branches:
      - fix/live-ppv-autohide-dpad-v2.2.5.3
      - main
    paths:
      - '.github/workflows/release-2.2.5.3.yml'
      - 'release-2.2.5.3-trigger.txt'
      - 'app/src/main/java/com/zerostreams/app/LivePpvShakaActivity.java'
      - 'tests/live-ppv-shaka-controls-2.2.5.3.test.cjs'
      - 'app/src/main/assets/ppv-shaka.html'
      - 'app/src/main/assets/ppv-shaka-controller.js'
      - 'app/src/main/java/com/zerostreams/app/MainActivity.java'
      - 'app/src/main/AndroidManifest.xml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeroplay-2-2-5-3-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare existing stable 2.2.5 stack and version 2.2.5.3
        run: |
          set -euo pipefail
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node tests/audio-boost-2.2.4.1.test.cjs
          node scripts/apply-custom-livetv-test.cjs
          node - <<'NODE'
          const fs=require('fs');
          const file='app/build.gradle';
          let text=fs.readFileSync(file,'utf8');
          if(!text.includes("versionName '2.2.5-test1'")||!text.includes('versionCode 51')) throw Error('2.2.5 base source changed');
          text=text.replace("versionName '2.2.5-test1'","versionName '2.2.5.3'");
          text=text.replace('versionCode 51','versionCode 56');
          fs.writeFileSync(file,text);
          NODE

      - name: Bundle the same Shaka Player version as ZeroPlay Windows
        run: |
          set -euo pipefail
          node -e "const j=require('./windows/package.json'); if(j.dependencies['shaka-player']!=='5.2.12') throw Error('Pinned Windows Shaka version changed');"
          tmp="$(mktemp -d)"
          cd "$tmp"
          npm pack shaka-player@5.2.12 --silent
          tar -xzf shaka-player-5.2.12.tgz package/dist/shaka-player.compiled.js package/LICENSE
          cp package/dist/shaka-player.compiled.js "$GITHUB_WORKSPACE/app/src/main/assets/ppv-shaka-player.compiled.js"
          cp package/LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/ppv-shaka-LICENSE"
          test "$(wc -c < "$GITHUB_WORKSPACE/app/src/main/assets/ppv-shaka-player.compiled.js")" -gt 250000
          echo "Bundled Shaka 5.2.12 with Apache-2.0 license notice"

      - name: Verify Live PPV-only routing and existing feature boundaries
        run: |
          set -euo pipefail
          grep -q "versionName '2.2.5.3'" app/build.gradle
          grep -q 'versionCode 56' app/build.gradle
          grep -q 'live?LivePpvShakaActivity.class:LivePlayerActivity.class' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'if(!getIntent().getBooleanExtra("liveList",false))' app/src/main/java/com/zerostreams/app/LivePpvShakaActivity.java
          grep -q 'new WebViewAssetLoader.Builder()' app/src/main/java/com/zerostreams/app/LivePpvShakaActivity.java
          grep -q 'script src="ppv-shaka-player.compiled.js"' app/src/main/assets/ppv-shaka.html
          grep -q 'Load M3U from file' app/src/main/java/com/zerostreams/app/MainActivity.java
          grep -q 'Restore original playlist' app/src/main/java/com/zerostreams/app/MainActivity.java
          node tests/audio-boost-2.2.4.test.cjs
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs
          node tests/live-ppv-shaka-controls-2.2.5.3.test.cjs

      - name: Unit test Android and Android TV
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest

      - name: Build and verify signed Android and Android TV APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-2.2.5.3-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease
          mkdir -p release-builds
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk release-builds/ZeroPlay-2.2.5.3-Android.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk release-builds/ZeroPlay-2.2.5.3-Android-TV.apk
          for apk in release-builds/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionName='2.2.5.3'"
            unzip -l "$apk" | grep -q 'assets/ppv-shaka-player.compiled.js'
          done

      - name: Lint Android and Android TV
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.5.3-Android-Shaka-APKs
          path: release-builds/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    if: github.ref == 'refs/heads/main'
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.5.3-Android-Shaka-APKs
          path: release-assets
      - name: Generate hashes
        run: |
          set -euo pipefail
          cd release-assets
          test -s ZeroPlay-2.2.5.3-Android.apk
          test -s ZeroPlay-2.2.5.3-Android-TV.apk
          sha256sum ZeroPlay-2.2.5.3-Android.apk ZeroPlay-2.2.5.3-Android-TV.apk > SHA256SUMS.txt
      - name: Publish v2.2.5.3 Android-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.5.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v2.2.5.3 already exists; refusing to overwrite'
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## ZeroPlay 2.2.5.3 — Android Live PPV Player Controls

          **Android and Android TV only.** Keeps the known-working Shaka Player 5.2.12 WebView introduced in v2.2.5.2.

          - Auto-hide both the top and bottom Live PPV player controls after 4.5 seconds of uninterrupted playback.
          - Reveal controls on a TV remote D-pad, Enter or Menu press, or a tap on the video screen.
          - Fix explicit Android TV D-pad focus traversal for Play/Pause, Live, Retry, Channels, Audio, Subtitles, Fit and Back.
          - First remote press while controls are hidden reveals them and focuses Play/Pause rather than accidentally activating an invisible button.
          - Keep controls visible during buffering, pause, errors and channel selection.
          - Preserve Shaka playback engine, M3U parser, CDN request behavior and Live PPV channel selection.

          No modifications to Windows, Live TV/IPTV, Live Sports, Movies, Series, Android TV Home/navigation, Audio Booster or protected backups. Existing stable v2.2.5 and all earlier release tags remain intact.

          Version **2.2.5.3** with Android versionCode **56**. Signed mobile and TV APKs plus SHA256SUMS.txt. Automated build/test success does not replace on-device testing.
          EOF
          gh release create v2.2.5.3 \
            release-assets/ZeroPlay-2.2.5.3-Android.apk \
            release-assets/ZeroPlay-2.2.5.3-Android-TV.apk \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ZeroPlay 2.2.5.3 — Android Live PPV Auto-Hide and D-pad Fix' \
            --notes-file release-notes.md \
            --latest
