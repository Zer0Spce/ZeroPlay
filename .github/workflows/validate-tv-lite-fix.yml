name: Validate Android TV Lite Fix

on:
  push:
    branches:
      - fix/android-tv-lite-2.2.2-regressions

permissions:
  contents: read

concurrency:
  group: validate-android-tv-lite-fix
  cancel-in-progress: true

jobs:
  android-tv-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests — Android TV Lite
        run: gradle :app:testLiteTvDebugUnitTest
      - name: Build Android TV Lite debug APK
        run: gradle :app:assembleLiteTvDebug
      - name: Lint Android TV Lite
        run: gradle :app:lintLiteTvDebug
      - name: Verify Lite package identity
        run: |
          apk=app/build/outputs/apk/liteTv/debug/app-liteTv-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "package: name='com.zerostreams.app.lite.tv'"
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-TV-Lite-fix-debug
          path: app/build/outputs/apk/liteTv/debug/app-liteTv-debug.apk
          if-no-files-found: error
          compression-level: 0
