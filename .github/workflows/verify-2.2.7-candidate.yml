name: ZeroPlay 2.2.7 candidate verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check updated JavaScript modules
        run: |
          node --check windows/playback-sources.cjs
          node --check web/public/playback-sources.js
          node --check windows/assets/vidrift-idle-227.js
          node --check app/src/main/assets/vidrift-idle-227.js
          node --check windows/main.cjs
      - name: Test v2.2.7 sources and existing source defaults
        run: |
          node --test tests/zeroplay-227-sources-and-vidrift.test.cjs
          node --test tests/zeroplay-2269-vidstuck-default.test.cjs
          node --test tests/zeroplay-2266-sources.test.cjs
          node --test tests/source-selection-regression.test.cjs
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android sources
        run: gradle :app:compileMobileDebugJavaWithJavac :app:compileTvDebugJavaWithJavac
