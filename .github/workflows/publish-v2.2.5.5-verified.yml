name: Publish Verified ZeroPlay v2.2.5.5 Android TV and Windows Builds

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v2.2.5.5-verified.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: zeroplay-publish-2-2-5-5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified Android TV APK (no mobile APK)
        uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.5.5-Android-TV
          run-id: 41985618821
          github-token: ${{ github.token }}
          path: release-assets
      - name: Retrieve matching verified Windows portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.5.5-Windows
          run-id: 41985618821
          github-token: ${{ github.token }}
          path: release-assets
      - name: Confirm artifacts and release notes
        run: |
          set -euo pipefail
          test -s docs/releases/v2.2.5.5.md
          test -s release-assets/ZeroPlay-2.2.5.5-Android-TV.apk
          test -s release-assets/ZeroPlay-2.2.5.5-Windows-x64.zip
          test "$(find release-assets -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          grep -Fq 'versionCode **59**' docs/releases/v2.2.5.5.md
          grep -Fq 'undefined version-formatting function' docs/releases/v2.2.5.5.md || grep -Fq 'Fixed startup failure' docs/releases/v2.2.5.5.md
          cd release-assets
          sha256sum ZeroPlay-2.2.5.5-Android-TV.apk ZeroPlay-2.2.5.5-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish v2.2.5.5 without modifying older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.5.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v2.2.5.5 already exists; will not overwrite'
            exit 1
          fi
          gh release create v2.2.5.5 \
            release-assets/ZeroPlay-2.2.5.5-Android-TV.apk \
            release-assets/ZeroPlay-2.2.5.5-Windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ZeroPlay v2.2.5.5 — Android TV Inline Navigation & Desktop Fix' \
            --notes-file docs/releases/v2.2.5.5.md \
            --latest
          gh release view v2.2.5.5 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name'
