name: Android TV Search Keyboard Hotfix

on:
  push:
    branches:
      - hotfix/android-tv-search-keyboard-2.2.1
    paths:
      - '.github/workflows/android-tv-search-keyboard-hotfix.yml'
      - '.github/workflows/release-2.2.1.1.yml'
      - 'app/build.gradle'
      - 'app/src/main/java/com/zerostreams/app/TvSearchIme.java'
      - 'app/src/main/java/com/zerostreams/app/TvMainActivity.java'
      - 'app/src/main/java/com/zerostreams/app/LiteTvMainActivity.java'
      - 'app/src/tv/AndroidManifest.xml'
      - 'app/src/liteTv/AndroidManifest.xml'
      - 'windows/package.json'
      - 'windows/updater.cjs'
      - 'windows/version-manager.cjs'
      - 'windows/scripts/apply-2.2.1.1-version.cjs'
      - 'windows/test/updater.test.cjs'
      - 'docs/release-2.2.1.1.md'
      - 'scripts/update-2.2.1.1-docs.py'
      - 'tests/android-tv-search-ime.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify 2.2.1.1 metadata and docs transform
        run: |
          set -euo pipefail
          grep -q "versionCode 46" app/build.gradle
          grep -q "versionName '2.2.1.1'" app/build.gradle
          grep -q '"version": "2.2.1-1"' windows/package.json
          grep -q '"buildVersion": "2.2.1.1"' windows/package.json
          grep -q 'ZeroPlay 2.2.1.1 — Android TV Search Keyboard Hotfix' docs/release-2.2.1.1.md
          grep -q 'gh release create v2.2.1.1' .github/workflows/release-2.2.1.1.yml
          python scripts/update-2.2.1.1-docs.py
          grep -q '# 🎬 ZeroPlay 2.2.1.1' README.md
          grep -q 'Current release: \*\*2.2.1.1\*\*' docs/changelog.md
          git diff --check
          git checkout -- README.md docs/changelog.md
      - name: Search keyboard and TV navigation regressions
        run: |
          node --test tests/android-tv-search-ime.test.cjs
          npm install --prefix /tmp/zero-tv-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-tv-tests/node_modules node tests/tv-navigation.test.cjs
      - name: Windows hotfix version regressions
        working-directory: windows
        run: |
          npm ci --no-audit --no-fund
          node --check updater.cjs
          node --check version-manager.cjs
          node --test test/updater.test.cjs
          node scripts/apply-2.2.1.1-version.cjs
          grep -q 'version:versions.normalizedVersion(app.getVersion())' main.cjs
          git checkout -- main.cjs
      - name: Android TV unit tests
        run: gradle :app:testTvDebugUnitTest :app:testLiteTvDebugUnitTest
      - name: Build full and Lite TV APKs
        run: gradle :app:assembleTvDebug :app:assembleLiteTvDebug
      - name: Verify APK version metadata
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/tv/debug/app-tv-debug.apk | head -n 1 | grep -q "versionName='2.2.1.1'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/liteTv/debug/app-liteTv-debug.apk | head -n 1 | grep -q "versionName='2.2.1.1'"
      - name: Lint full and Lite TV variants
        run: gradle --continue :app:lintTvDebug :app:lintLiteTvDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.1.1-TV-Search-Keyboard-Hotfix-${{ github.sha }}
          path: |
            app/build/outputs/apk/tv/debug/*.apk
            app/build/outputs/apk/liteTv/debug/*.apk
          if-no-files-found: error
