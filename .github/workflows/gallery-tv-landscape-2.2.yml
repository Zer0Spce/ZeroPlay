name: Capture ZeroPlay 2.2 TV landscape and Hybrid controls
on:
  push:
    branches: [docs/zeroplay-2.2-gallery]
    paths: [.github/workflows/gallery-tv-landscape-2.2.yml, scripts/FeatureGalleryTest.java]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare native capture test
        run: cp scripts/FeatureGalleryTest.java app/src/androidTest/java/com/zerostreams/app/FeatureGalleryTest.java
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: tv_1080p
          disable-animations: true
          script: |
            adb shell wm size reset
            adb shell wm density 240
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            gradle :app:connectedTvDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.zerostreams.app.GalleryTest,com.zerostreams.app.FeatureGalleryTest
            mkdir -p docs/screenshots/2.2
            for name in home categories live-sports settings home-panels layout-google layout-classic layout-youtube hybrid-controls profiles moods; do adb pull "/data/local/tmp/zeroplay-$name.png" "docs/screenshots/2.2/android-tv-$name.png"; done
      - name: Verify landscape PNG geometry
        run: |
          python - <<'PYTHON'
          import struct
          from pathlib import Path
          paths=list(Path('docs/screenshots/2.2').glob('android-tv-*.png'))
          assert len(paths)==11, len(paths)
          for p in paths:
              width,height=struct.unpack('>II',p.read_bytes()[16:24])
              assert (width,height)==(1920,1080),(p.name,width,height)
          print('All eleven captures are true 1920x1080 landscape PNGs')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-tv-landscape-2.2
          path: docs/screenshots/2.2/android-tv-*.png
          if-no-files-found: error
      - name: Preserve landscape captures
        env:
          GALLERY_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'ZeroPlay'
          git config user.email 'zeroplay@users.noreply.github.com'
          git add docs/screenshots/2.2/android-tv-*.png
          git commit -m 'Capture native TV in landscape with Hybrid profiles and mood settings'
          git push origin "HEAD:$GALLERY_BRANCH"
