name: ZeroPlay 2.2.3.1 Android TV Lite Hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeroplay-2-2-3-1-tv-lite
  cancel-in-progress: false

jobs:
  lite-tv-hotfix:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release Android TV Lite hotfix 2.2.3.1'
    name: Android TV Lite v2.1.2 player baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore exact v2.1.2 Android TV player stack
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse v2.1.2 >/dev/null
          git checkout v2.1.2 -- \
            app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/TvMouse.java \
            app/src/main/java/com/zerostreams/app/PlayerAdScan.java \
            app/src/main/assets/player-guard.js \
            app/src/main/assets/tv-player-input.js

          # Keep the v2.1.2 player files otherwise byte-for-byte equivalent,
          # changing only the retired VidStuck host where it appears.
          sed -i 's/vidstuck\.xyz/vidstuck.cc/g' \
            app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/TvMouse.java \
            app/src/main/java/com/zerostreams/app/PlayerAdScan.java \
            app/src/main/assets/player-guard.js \
            app/src/main/assets/tv-player-input.js

          python - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          old="""        liteTv {\n            dimension 'device'\n            applicationIdSuffix '.lite.tv'\n            buildConfigField 'boolean', 'TV', 'true'\n            buildConfigField 'boolean', 'LITE', 'true'\n        }"""
          new="""        liteTv {\n            dimension 'device'\n            applicationIdSuffix '.lite.tv'\n            versionCode 48\n            versionName '2.2.3.1'\n            buildConfigField 'boolean', 'TV', 'true'\n            buildConfigField 'boolean', 'LITE', 'true'\n        }"""
          if s.count(old)!=1:
              raise SystemExit('Could not isolate liteTv version block')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Verify literal v2.1.2 player baseline plus cc-only substitution
        shell: bash
        run: |
          set -euo pipefail
          grep -A8 'liteTv {' app/build.gradle | grep -q "versionCode 48"
          grep -A8 'liteTv {' app/build.gradle | grep -q "versionName '2.2.3.1'"
          grep -q 'vidstuck.cc' app/src/main/java/com/zerostreams/app/PlaybackSources.java
          ! grep -R 'vidstuck.xyz' \
            app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/TvMouse.java \
            app/src/main/java/com/zerostreams/app/PlayerAdScan.java \
            app/src/main/assets/player-guard.js \
            app/src/main/assets/tv-player-input.js

          for f in \
            app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java \
            app/src/main/java/com/zerostreams/app/TvMouse.java \
            app/src/main/java/com/zerostreams/app/PlayerAdScan.java \
            app/src/main/assets/player-guard.js \
            app/src/main/assets/tv-player-input.js; do
            git show "v2.1.2:$f" | sed 's/vidstuck\.xyz/vidstuck.cc/g' > /tmp/expected
            cmp -s /tmp/expected "$f" || { echo "Unexpected change in $f"; diff -u /tmp/expected "$f" || true; exit 1; }
          done

      - name: Build signed Android TV Lite APK only
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleLiteTvRelease
          apk=app/build/outputs/apk/liteTv/release/app-liteTv-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionCode='48'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | head -n 1 | grep -q "versionName='2.2.3.1'"
          mkdir -p release-assets
          cp "$apk" release-assets/ZeroPlay-2.2.3.1-Android-TV-Lite.apk
          sha256sum release-assets/ZeroPlay-2.2.3.1-Android-TV-Lite.apk | sed 's#release-assets/##' > release-assets/SHA256SUMS.txt

      - name: Lint Android TV Lite only
        run: gradle :app:lintLiteTvRelease

      - name: Audit hotfix APK
        run: python scripts/audit-release-secrets.py release-assets app/src

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.3.1-Android-TV-Lite
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

      - name: Replace existing 2.2.3.1 TV Lite prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v2.2.3.1'
          title='ZeroPlay 2.2.3.1 — Android TV Lite Hotfix'
          notes='docs/releases/2.2.3.1.md'
          gh release upload "$tag" release-assets/ZeroPlay-2.2.3.1-Android-TV-Lite.apk release-assets/SHA256SUMS.txt --clobber
          gh release edit "$tag" --title "$title" --notes-file "$notes" --prerelease
