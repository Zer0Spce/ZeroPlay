name: Prepare ZeroPlay 2.2.2 Clean

on:
  push:
    branches: [ release/2.2.2-clean ]
    paths: [ '.release-2.2.2-prepare' ]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply clean 2.2.2 source update
        run: |
          sed -i "/replaceAll('app\/src\/main\/assets\/player-guard.js'/d" scripts/prepare-2.2.2-clean.cjs
          node scripts/prepare-2.2.2-clean.cjs
          cat > windows/test/playback-sources.test.cjs <<'EOF'
          const test=require('node:test'),assert=require('node:assert/strict'),sources=require('../playback-sources.cjs');
          test('Playback sources build movie and TV-special URLs with TMDB IDs',()=>{assert.equal(sources.sources.length,5);for(const provider of sources.sources.filter(p=>p.id!=='rawcast')){const movie=new URL(sources.url({id:299534,type:'movie'}, {},provider.id)),tv=new URL(sources.url({id:1399,type:'tv'},{season:0,episode:2},provider.id));assert.equal(sources.trusted(movie.href),true);const prefix=provider.id==='zxcstream'?'/player/':'/embed/';assert.equal(movie.pathname,prefix+'movie/299534');assert.equal(tv.pathname,prefix+'tv/1399/0/2');}assert.equal(new URL(sources.url({id:299534,type:'movie'}, {},'embedwave')).hostname,'embedwave.cc');const zxc=new URL(sources.url({id:299534,type:'movie'}, {},'zxcstream'));assert.equal(zxc.hostname,'zxcstream.cc');assert.equal(zxc.pathname,'/player/movie/299534');assert.equal(zxc.searchParams.get('color'),'65E6CC');assert.equal(zxc.searchParams.get('autoplay'),'true');});
          test('Unknown saved providers migrate to the recommended source',()=>{assert.equal(sources.source('retired-provider').id,'vidstuck');assert.equal(new URL(sources.url({id:1,type:'movie'},{},'retired-provider')).hostname,'vidstuck.cc');});
          test('Resume parameters are sent to supporting sources',()=>{const pos={timestamp:120,percent:10},item={id:299534,type:'movie'};assert.equal(new URL(sources.url(item,pos,'vidsrc-sh')).searchParams.get('startAt'),'120');assert.equal(new URL(sources.url(item,pos,'vidstuck')).searchParams.get('progress'),'120');});
          test('Trusted playback domains cannot be extended and progress retains title identity',()=>{assert.equal(sources.trusted('https://vidsrc.sh.attacker.example/'),false);assert.equal(sources.trusted('http://vidsrc.sh/'),false);assert.equal(sources.trusted('https://embedwave.cc/embed/movie/1'),true);assert.equal(sources.trusted('https://zxcstream.cc/player/movie/1'),true);assert.deepEqual(sources.normalize({type:'PLAYER_EVENT',data:{player_info:{tmdb:299534,mediaType:'movie'},player_progress:120,player_duration:7200}}),{id:299534,type:'movie',timestamp:120,duration:7200,season:undefined,episode:undefined});assert.equal(sources.normalize({type:'PLAYER_EVENT',data:{player_info:{imdb:'tt123'}}}),null);});
          test('RawCast requires secure API resolution instead of an embed URL',()=>{assert.ok(sources.sources.find(p=>p.id==='rawcast').name.includes('Limited'));assert.throws(()=>sources.url({id:550,type:'movie'},{},'rawcast'),/secure API/);});
          EOF
          node <<'NODE'
          const fs=require('fs');const p='web/test/web-surface.test.cjs';let s=fs.readFileSync(p,'utf8');
          s=s.replace("test('website is labeled as ZeroPlay 2.2 Web'","test('website is labeled as ZeroPlay 2.2.2 Web'");
          s=s.replace("assert.match(browser,/version:'2\\.2 Web'/);","assert.match(browser,/version:'2\\.2\\.2 Web'/);");
          s=s.replace("assert.match(sw,/zeroplay-web-2\\.2-shell-20261014d/);","assert.match(sw,/zeroplay-web-2\\.2\\.2/);");
          fs.writeFileSync(p,s);
          NODE
      - name: Source selection regressions
        run: node --test tests/source-selection-regression.test.cjs
      - name: Windows tests
        working-directory: windows
        run: |
          npm ci
          npm test
      - name: Website tests
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Verify release source invariants
        run: |
          grep -R "vidstuck.xyz" app windows web --exclude-dir=node_modules && exit 1 || true
          grep -q "vidstuck.cc" app/src/main/java/com/zerostreams/app/PlaybackSources.java
          grep -q "zxcstream.cc" app/src/main/java/com/zerostreams/app/PlaybackSources.java
          grep -q "ZXCStream (Beta)" windows/playback-sources.cjs
          grep -q "ZXCStream (Beta)" web/public/playback-sources.js
          grep -q "versionName '2.2.2'" app/build.gradle
          grep -q '"version": "2.2.2"' windows/package.json
          grep -q "Default video source" app/src/main/java/com/zerostreams/app/MainActivity.java
      - name: Commit validated 2.2.2 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/release-2.2.2.md app windows web tests vercel.json netlify.toml
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Prepare ZeroPlay v2.2.2 clean source"
            git push origin HEAD:release/2.2.2-clean
          fi
