name: ZeroPlay 2.2 Web Development
on:
  push:
    branches:
      - feature/2.2-navigation-discovery-performance
    paths:
      - '.github/workflows/develop-2.2-web.yml'
      - 'scripts/apply-2.2-web.cjs'
      - 'scripts/apply-embedwave-beta.cjs'
      - 'web/public/playback-sources.js'
      - 'web/public/web-fixes.js'
      - 'web/public/zero22.js'
      - 'web/public/zero22.css'
      - 'web/scripts/ui-check.cjs'
      - 'web/test/catalog.test.cjs'
      - 'web/test/web-surface.test.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zeroplay-2-2-web-development
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/2.2-navigation-discovery-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic website 2.2 patch
        run: |
          node scripts/apply-2.2-web.cjs
          node scripts/apply-embedwave-beta.cjs
      - name: Validate generated JavaScript
        run: |
          git diff --check
          node --check web/public/browser.js
          node --check web/public/app.js
          node --check web/public/playback-sources.js
          node --check web/public/zero22.js
          node --check web/public/infinite-scroll.js
          node --check web/lib/catalog.cjs
          git diff --stat
      - name: Website unit tests
        run: node --test web/test/*.test.cjs
      - name: Website UI checks
        run: |
          npm install --prefix /tmp/zero-web-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-web-tests/node_modules node web/scripts/ui-check.cjs
      - name: Verify 2.2 web boundaries
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('web/public/index.html','utf8');
          const js=fs.readFileSync('web/public/zero22.js','utf8');
          const browser=fs.readFileSync('web/public/browser.js','utf8');
          const sources=fs.readFileSync('web/public/playback-sources.js','utf8');
          const scroll=fs.readFileSync('web/public/infinite-scroll.js','utf8');
          if(!html.includes('zero22.js')||!html.includes('zero22.css'))throw Error('2.2 web assets are not loaded');
          if(/Live TV|Live Sports|PPV/.test(html))throw Error('Website-only live sections must stay removed');
          for(const feature of ['Because you watched','Hidden gems','Episode calendar','search/person','profile-switch','zero22CatalogRequest'])if(!js.includes(feature))throw Error('Missing web 2.2 feature: '+feature);
          if(!scroll.includes('zero22CatalogRequest'))throw Error('Filtered infinite scroll hook missing');
          if(!html.includes('https://embedwave.cc')||!html.includes('Embedwave (BETA)'))throw Error('Embedwave website shell integration missing');
          if(!browser.includes("['vidstuck','embedwave']")||!sources.includes("id:'embedwave'"))throw Error('Embedwave website playback integration missing');
          console.log('2.2 website boundaries and Embedwave source verified');
          NODE
      - name: Validate website build
        run: node web/scripts/build.cjs
      - name: Upload website development build
        uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2-Web-development
          path: web/public
          if-no-files-found: error
      - name: Commit generated web source only after checks pass
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated web changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lib/catalog.cjs web/public/browser.js web/public/app.js web/public/index.html web/public/infinite-scroll.js
          git commit -m '[2.2 generated] Apply website discovery performance and Embedwave features'
          git fetch origin feature/2.2-navigation-discovery-performance
          git rebase origin/feature/2.2-navigation-discovery-performance
          git push origin HEAD:feature/2.2-navigation-discovery-performance
