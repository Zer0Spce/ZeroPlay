name: ZeroPlay 2.3 50-point Test Branch

on:
  push:
    branches:
      - dev/2.3-50-point-enhancements
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeroplay-2-3-test-${{ github.ref }}
  cancel-in-progress: true

env:
  ZERO23_BASE: 88be9d5493cdb3ed153b2ec4666c6262bce723ba

jobs:
  contract-and-web:
    name: 50-point contract + Web test build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce test-only branch and frozen player boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "dev/2.3-50-point-enhancements"
          changed="$(git diff --name-only "$ZERO23_BASE" HEAD)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(windows/(main\.cjs|preload\.cjs|playback-sources\.cjs|player-.*|mpv-.*|offline-.*|ui/app\.js|ui/.*player.*)|web/public/(browser\.js|app\.js|playback-sources\.js|web-native\.js)|app/src/main/java/com/zerostreams/app/(MainActivity|PlaybackSources|PlayerActivity|BrowserPlayerActivity|LivePlayerActivity|SportsPlayerActivity)\.java)$'; then
            echo 'A frozen 2.2.2 player/provider file changed.' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '^(release-assets/|windows/dist/|app/build/outputs/apk/.*/release/)'; then
            echo 'Release output must never be committed on the 2.3 test branch.' >&2
            exit 1
          fi

      - name: Validate 50-point contract
        run: |
          node --check web/public/zero23.js
          node --check windows/ui/zero23.js
          node --test tests/zero23-50-point.test.cjs

      - name: Run existing website regressions
        run: |
          node --test web/test/*.test.cjs
          npm install --prefix /tmp/zero-web-tests --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/zero-web-tests/node_modules node web/scripts/ui-check.cjs
          node web/scripts/build.cjs

      - name: Package Web test artifact only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/web
          cp -R web/public/. test-artifacts/web/
          printf '%s\n' 'ZeroPlay 2.3 TEST BUILD — not a release' > test-artifacts/web/TEST-BUILD.txt
          (cd test-artifacts && zip -qr ZeroPlay-2.3-TEST-Web.zip web)

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.3-TEST-Web
          path: test-artifacts/ZeroPlay-2.3-TEST-Web.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android Phone + TV test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run player-safety and Android regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/default-player-controls-regression.test.cjs
          node --test tests/zero23-50-point.test.cjs
          gradle :app:testMobileDebugUnitTest :app:testTvDebugUnitTest

      - name: Build unsigned/debug test APKs only
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleMobileDebug :app:assembleTvDebug :app:assembleLiteMobileDebug :app:assembleLiteTvDebug
          mkdir -p test-artifacts
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk test-artifacts/ZeroPlay-2.3-TEST-Android.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk test-artifacts/ZeroPlay-2.3-TEST-Android-TV.apk
          cp app/build/outputs/apk/liteMobile/debug/app-liteMobile-debug.apk test-artifacts/ZeroPlay-2.3-TEST-Android-Lite.apk
          cp app/build/outputs/apk/liteTv/debug/app-liteTv-debug.apk test-artifacts/ZeroPlay-2.3-TEST-Android-TV-Lite.apk
          printf '%s\n' 'ZeroPlay 2.3 TEST BUILDS — debug signed, not releases' > test-artifacts/TEST-BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.3-TEST-Android
          path: test-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows runnable test ZIP
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Preserve committed line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies and run regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm ci --prefix windows --no-audit --no-fund
          node tests/source-selection-regression.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Source selection regression failed'}
          node tests/auto-source-recovery-default.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Auto-source regression failed'}
          node tests/default-player-controls-regression.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Player-controls regression failed'}
          node --test tests/zero23-50-point.test.cjs
          if($LASTEXITCODE -ne 0){throw '2.3 contract failed'}
          Push-Location windows
          npm test
          if($LASTEXITCODE -ne 0){throw 'Windows tests failed'}
          node --check ui/zero23.js
          npm install --prefix ../ui-test-deps --no-audit --no-fund jsdom@24.1.3
          $env:NODE_PATH="${{ github.workspace }}\ui-test-deps\node_modules"
          node scripts/ui-check.cjs
          if($LASTEXITCODE -ne 0){throw 'Windows UI check failed'}
          Pop-Location

      - name: Prepare existing 2.2.2 runtime stack in workspace
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          npm run prepare-config
          $url='https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261009/mpv-x86_64-20261009-git-36abaa32d0.7z'
          $expected='9afbe74f4ab885ca512769f8835758eb66b7b8a5ea6d679500588f8e7fec632e'
          Invoke-WebRequest -Uri $url -OutFile mpv.7z
          $actual=(Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "mpv SHA-256 mismatch: $actual"}
          New-Item -ItemType Directory -Force vendor/mpv | Out-Null
          7z x mpv.7z -ovendor/mpv -y | Out-Host
          $mpv=Get-ChildItem vendor/mpv -Filter mpv.exe -Recurse | Select-Object -First 1
          if(-not $mpv){throw 'mpv.exe missing after extraction'}
          if($mpv.Directory.FullName -ne (Resolve-Path vendor/mpv).Path){Copy-Item "$($mpv.Directory.FullName)/*" vendor/mpv -Recurse -Force}
          Remove-Item mpv.7z -Force
          foreach($script in @('scripts/apply-offline-mpv-test.cjs','scripts/apply-final-windows-polish.cjs','scripts/apply-episode-progress-fix.cjs','scripts/apply-windows-episode-completion-fix.cjs','scripts/fix-final-windows-action-tdz.cjs','scripts/apply-2.1.2-player-adblock.cjs')){
            node $script
            if($LASTEXITCODE -ne 0){throw "Runtime preparation failed: $script"}
          }
          $pkg=Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.build.win.artifactName='ZeroPlay-2.3-TEST-Windows-x64.${ext}'
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8
          if(!(Test-Path ui/zero23.js)){throw '2.3 Windows layer missing after runtime preparation'}
          node --check ui/zero23.js

      - name: Build native host and updater helpers
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish mpv-host-helper/MpvVideoHost.csproj -c Release -r win-x64 --self-contained true -o mpv-host-helper/publish
          Copy-Item mpv-host-helper/publish/MpvVideoHost.exe ./MpvVideoHost.exe -Force
          dotnet publish updater-helper/ZeroPlayUpdater.csproj -c Release -r win-x64 --self-contained true -o updater-helper/publish
          Copy-Item updater-helper/publish/ZeroPlayUpdater.exe ./ZeroPlayUpdater.exe -Force

      - name: Electron smoke test
        timeout-minutes: 9
        shell: pwsh
        working-directory: windows
        run: |
          npx electron . --smoke-test
          if($LASTEXITCODE -ne 0){throw "Electron smoke test failed: $LASTEXITCODE"}

      - name: Build test ZIP only
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          npx electron-builder --win --x64 --publish never
          $zip=Get-ChildItem dist -Filter 'ZeroPlay-2.3-TEST-Windows-x64.zip' | Select-Object -First 1
          if(-not $zip){throw 'Windows 2.3 test ZIP was not created'}
          Set-Content -Path dist/TEST-BUILD.txt -Value 'ZeroPlay 2.3 TEST BUILD — not a release'

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.3-TEST-Windows
          path: |
            windows/dist/ZeroPlay-2.3-TEST-Windows-x64.zip
            windows/dist/TEST-BUILD.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
