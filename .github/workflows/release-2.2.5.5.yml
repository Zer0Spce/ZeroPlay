name: ZeroPlay v2.2.5.5 — Android TV Dropdowns and Windows Desktop Fix

on:
  push:
    branches:
      - fix/android-tv-inline-source-dropdowns-v2.2.5.5
      - main
    paths:
      - '.github/workflows/release-2.2.5.5.yml'
      - 'app/src/main/java/com/zerostreams/app/MainActivity.java'
      - 'app/src/main/java/com/zerostreams/app/TvSourceNavigation.java'
      - 'windows/main.cjs'
      - 'windows/version-manager.cjs'
      - 'windows/updater.cjs'
      - 'scripts/apply-2.2.4.1-audio-hotfix.cjs'
      - 'windows/test/desktop-startup-2.2.5.5.test.cjs'
      - 'windows/test/updater.test.cjs'
      - 'tests/android-tv-source-navigation-2.2.5.4.test.cjs'
      - 'docs/releases/v2.2.5.5.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeroplay-2255-tv-windows-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android_tv:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android TV per-source inline navigation and working Shaka player
        run: |
          set -euo pipefail
          node tests/android-tv-source-navigation-2.2.5.4.test.cjs
          node tests/live-ppv-shaka-controls-2.2.5.3.test.cjs
          node tests/default-player-controls-regression.test.cjs
          node tests/source-selection-regression.test.cjs
          node --test tests/all-platform-embeds-2.2.5.3.test.cjs

      - name: Preserve existing TV stack and use version 2.2.5.5 code 59
        run: |
          set -euo pipefail
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node tests/audio-boost-2.2.4.1.test.cjs
          node scripts/apply-custom-livetv-test.cjs
          node - <<'NODE'
          const fs=require('node:fs'),file='app/build.gradle';
          let text=fs.readFileSync(file,'utf8');
          if(!text.includes("versionName '2.2.5-test1'")||!text.includes('versionCode 51'))
            throw Error('Unexpected baseline; will not build TV release');
          text=text.replace("versionName '2.2.5-test1'","versionName '2.2.5.5'");
          text=text.replace('versionCode 51','versionCode 59');
          fs.writeFileSync(file,text);
          NODE
          grep -q "versionName '2.2.5.5'" app/build.gradle
          grep -q 'versionCode 59' app/build.gradle

      - name: Include original Shaka 5.2.12 assets without altering player behavior
        run: |
          set -euo pipefail
          node -e "if(require('./windows/package.json').dependencies['shaka-player']!=='5.2.12')throw Error('Shaka version changed');"
          temp="$(mktemp -d)"
          cd "$temp"
          npm pack shaka-player@5.2.12 --silent
          tar -xzf shaka-player-5.2.12.tgz package/dist/shaka-player.compiled.js package/LICENSE
          cp package/dist/shaka-player.compiled.js "$GITHUB_WORKSPACE/app/src/main/assets/ppv-shaka-player.compiled.js"
          cp package/LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/ppv-shaka-LICENSE"

      - name: Run Android TV unit tests only
        run: gradle :app:testTvReleaseUnitTest

      - name: Build and verify signed Android TV APK only
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-2.2.5.5-tv.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleTvRelease
          mkdir -p release-builds
          cp app/build/outputs/apk/tv/release/app-tv-release.apk release-builds/ZeroPlay-2.2.5.5-Android-TV.apk
          apk=release-builds/ZeroPlay-2.2.5.5-Android-TV.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionName='2.2.5.5'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionCode='59'"
          unzip -l "$apk" | grep -q 'assets/ppv-shaka-player.compiled.js'
          test "$(find release-builds -type f -name '*.apk' | wc -l)" -eq 1

      - name: Lint Android TV release only
        run: gradle :app:lintTvRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.5.5-Android-TV
          path: release-builds/ZeroPlay-2.2.5.5-Android-TV.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install Windows dependencies
        working-directory: windows
        run: npm ci --no-audit --no-fund

      - name: Apply preserved Windows baseline and set 2.2.5.5 package version
        run: |
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node scripts/apply-custom-livetv-windows-test.cjs
          node -e "const fs=require('fs'),p='windows/package.json',j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.version!=='2.2.5-test1')throw Error('Unexpected baseline');j.version='2.2.5-5';j.build.buildVersion='2.2.5.5';j.build.win.artifactName='ZeroPlay-2.2.5.5-Windows-x64.'+String.fromCharCode(36)+'{ext}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          node -e "const p=require('./windows/version-manager.cjs');if(p.publicVersion('2.2.5-5')!=='2.2.5.5')throw Error('Public version mapping missing');"

      - name: Windows regressions including desktop boot and update comparison
        working-directory: windows
        run: |
          npm test
          node -e "const fs=require('node:fs');let code=fs.readFileSync('main.cjs','utf8');if(!code.includes('version:versions.publicVersion(app.getVersion())'))throw Error('Desktop startup version regression');const p=require('./package.json');if(p.version!=='2.2.5-5'||p.build.buildVersion!=='2.2.5.5')throw Error('Version mismatch')"

      - name: Build Windows x64 portable ZIP
        working-directory: windows
        run: npm run build

      - name: Run packaged Windows desktop UI boot smoke test
        shell: pwsh
        run: |
          $exe = (Get-Item 'windows/dist/win-unpacked/ZeroPlay.exe' -ErrorAction Stop).FullName
          $process = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test','--disable-gpu' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Packaged desktop UI startup timed out'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged ZeroPlay.exe UI startup failed with code $($process.ExitCode)"
          }
          Write-Host 'Packaged Windows UI passed startup smoke check'

      - name: Verify Windows portable ZIP
        shell: pwsh
        run: |
          $zip=Get-Item windows/dist/ZeroPlay-2.2.5.5-Windows-x64.zip -ErrorAction Stop
          if($zip.Length -lt 5000000){throw 'Windows ZIP missing or too small'}
          if(-not [string]::IsNullOrWhiteSpace($env:CSC_LINK)){
            $exe=Get-ChildItem windows/dist/win-unpacked -Filter *.exe -File | Select-Object -First 1
            if(-not $exe){throw 'Windows EXE missing'}
            if((Get-AuthenticodeSignature $exe.FullName).Status -ne 'Valid'){throw 'Windows signing verification failed'}
          }else{Write-Warning 'Windows build unsigned (no signing credentials configured)'}

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.5.5-Windows
          path: windows/dist/ZeroPlay-2.2.5.5-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    if: github.ref == 'refs/heads/main'
    needs: [android_tv, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.5.5-Android-TV
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.5.5-Windows
          path: release-assets

      - name: Verify only TV and Windows packages and create checksums
        run: |
          set -euo pipefail
          cd release-assets
          test -s ZeroPlay-2.2.5.5-Android-TV.apk
          test -s ZeroPlay-2.2.5.5-Windows-x64.zip
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          sha256sum ZeroPlay-2.2.5.5-Android-TV.apk ZeroPlay-2.2.5.5-Windows-x64.zip > SHA256SUMS.txt

      - name: Publish new v2.2.5.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.5.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v2.2.5.5 already exists; refusing to overwrite'
            exit 1
          fi
          gh release create v2.2.5.5 \
            release-assets/ZeroPlay-2.2.5.5-Android-TV.apk \
            release-assets/ZeroPlay-2.2.5.5-Windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ZeroPlay v2.2.5.5 — Android TV Dropdowns & Windows Desktop Fix' \
            --notes-file docs/releases/v2.2.5.5.md \
            --latest
