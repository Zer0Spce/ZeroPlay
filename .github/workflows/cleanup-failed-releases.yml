name: Cleanup failed 2.2.1 patch releases

on:
  push:
    branches:
      - cleanup-failed-releases

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove failed release entries and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v2.2.1.1 v2.2.1.2 v2.2.1.3 v2.2.1.4; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
          done
          echo "Failed 2.2.1 patch release cleanup complete."
