name: Package ZeroPlay 2.2 Test Builds

on:
  push:
    branches:
      - feature/2.2-navigation-discovery-performance
    paths:
      - '.github/workflows/package-2.2-test-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeroplay-2-2-test-builds
  cancel-in-progress: true

jobs:
  android:
    name: Android + Android TV signed test builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify current 2.2 fixes
        run: |
          node --test tests/source-selection-regression.test.cjs tests/auto-source-recovery-default.test.cjs
      - name: Unit tests
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest
      - name: Build signed APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/mobile/release/app-mobile-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/tv/release/app-tv-release.apk
          mkdir -p delivery
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk delivery/ZeroPlay-2.2-TEST-Android.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk delivery/ZeroPlay-2.2-TEST-Android-TV.apk
          sha256sum delivery/*.apk > delivery/SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2-TEST-Android
          path: delivery/*
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows portable test build
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Verify current 2.2 fixes
        shell: pwsh
        run: |
          node --test tests/source-selection-regression.test.cjs tests/auto-source-recovery-default.test.cjs tests/windows-home-order-dedupe.test.cjs
          if ($LASTEXITCODE -ne 0) { throw '2.2 regression verification failed' }
      - name: Install dependencies
        working-directory: windows
        run: npm ci --no-audit --no-fund
      - name: Windows unit tests
        working-directory: windows
        run: npm test
      - name: Package portable build
        working-directory: windows
        shell: pwsh
        run: |
          npm run build -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          $zip = Get-ChildItem dist -Filter 'ZeroPlay-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Windows ZIP not found' }
          New-Item -ItemType Directory -Force delivery | Out-Null
          Copy-Item $zip.FullName delivery/ZeroPlay-2.2-TEST-Windows-x64.zip -Force
          (Get-FileHash delivery/ZeroPlay-2.2-TEST-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content delivery/SHA256-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2-TEST-Windows
          path: windows/delivery/*
          if-no-files-found: error
          compression-level: 0

  web:
    name: Web test build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Website tests
        run: node --test web/test/*.test.cjs
      - name: Build website
        run: node web/scripts/build.cjs
      - name: Package website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          (cd web/public && zip -qr ../../delivery/ZeroPlay-2.2-TEST-Web.zip .)
          sha256sum delivery/ZeroPlay-2.2-TEST-Web.zip > delivery/SHA256-Web.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2-TEST-Web
          path: delivery/*
          if-no-files-found: error
          compression-level: 0
