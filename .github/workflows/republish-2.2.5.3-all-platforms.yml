name: ZeroPlay 2.2.5.3 All-Platform Playback Sources — Replace Release Assets

on:
  push:
    branches:
      - fix/all-platform-vidrock-vidnest-republish-2.2.5.3
      - main
    paths:
      - '.github/workflows/republish-2.2.5.3-all-platforms.yml'
      - 'app/src/main/java/com/zerostreams/app/PlaybackSources.java'
      - 'app/src/main/java/com/zerostreams/app/MainActivity.java'
      - 'app/src/main/java/com/zerostreams/app/BrowserPlayerActivity.java'
      - 'windows/playback-sources.cjs'
      - 'windows/ui/app.js'
      - 'windows/ui/index.html'
      - 'windows/main.cjs'
      - 'windows/core.cjs'
      - 'web/public/playback-sources.js'
      - 'web/public/browser.js'
      - 'web/public/index.html'
      - 'tests/all-platform-embeds-2.2.5.3.test.cjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeroplay-sources-republish-2-2-5-3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify all-platform providers, player isolation and existing controls
        run: |
          set -euo pipefail
          node --test tests/all-platform-embeds-2.2.5.3.test.cjs
          node tests/source-selection-regression.test.cjs
          node tests/auto-source-recovery-default.test.cjs
          node tests/live-ppv-shaka-controls-2.2.5.3.test.cjs
          node tests/default-player-controls-regression.test.cjs

      - name: Preserve base features and build Android version 2.2.5.3 code 57
        run: |
          set -euo pipefail
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node tests/audio-boost-2.2.4.1.test.cjs
          node scripts/apply-custom-livetv-test.cjs
          node - <<'NODE'
          const fs=require('node:fs'),path='app/build.gradle';
          let code=fs.readFileSync(path,'utf8');
          if(!code.includes("versionName '2.2.5-test1'")||!code.includes('versionCode 51'))throw Error('Unexpected Android baseline version');
          code=code.replace("versionName '2.2.5-test1'","versionName '2.2.5.3'");
          code=code.replace('versionCode 51','versionCode 57');
          fs.writeFileSync(path,code);
          NODE
          grep -q "versionName '2.2.5.3'" app/build.gradle
          grep -q 'versionCode 57' app/build.gradle

      - name: Bundle original Shaka 5.2.12 for unaffected Android Live PPV
        run: |
          set -euo pipefail
          node -e "const p=require('./windows/package.json');if(p.dependencies['shaka-player']!=='5.2.12')throw Error('Expected Shaka version 5.2.12');"
          temp="$(mktemp -d)"
          cd "$temp"
          npm pack shaka-player@5.2.12 --silent
          tar -xzf shaka-player-5.2.12.tgz package/dist/shaka-player.compiled.js package/LICENSE
          cp package/dist/shaka-player.compiled.js "$GITHUB_WORKSPACE/app/src/main/assets/ppv-shaka-player.compiled.js"
          cp package/LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/ppv-shaka-LICENSE"
          test "$(wc -c < "$GITHUB_WORKSPACE/app/src/main/assets/ppv-shaka-player.compiled.js")" -gt 250000

      - name: Run Android and Android TV unit tests
        run: gradle :app:testMobileReleaseUnitTest :app:testTvReleaseUnitTest

      - name: Build and verify signed Android and Android TV APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/zeroplay-sources2253.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle :app:assembleMobileRelease :app:assembleTvRelease
          mkdir -p release-builds
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk release-builds/ZeroPlay-2.2.5.3-Android.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk release-builds/ZeroPlay-2.2.5.3-Android-TV.apk
          for apk in release-builds/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionName='2.2.5.3'"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "versionCode='57'"
            unzip -l "$apk" | grep -q 'assets/ppv-shaka-player.compiled.js'
          done

      - name: Android and Android TV lint
        run: gradle --continue :app:lintMobileRelease :app:lintTvRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.5.3-All-Source-Android
          path: release-builds/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install Windows dependencies
        working-directory: windows
        run: npm ci --no-audit --no-fund
      - name: Verify all source URLs and player options
        run: |
          node --test tests/all-platform-embeds-2.2.5.3.test.cjs
          node tests/source-selection-regression.test.cjs
      - name: Keep Windows 2.2.5 baseline and set public version 2.2.5.3
        run: |
          node scripts/apply-2.2.4-volume-boost.cjs
          node scripts/apply-2.2.4.1-audio-hotfix.cjs
          node scripts/apply-custom-livetv-windows-test.cjs
          node -e "const fs=require('fs'),p='windows/package.json',j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.version!=='2.2.5-test1')throw Error('Windows baseline changed');j.version='2.2.5.3';j.build.buildVersion='2.2.5.3';j.build.win.artifactName='ZeroPlay-2.2.5.3-Windows-x64.'+String.fromCharCode(36)+'{ext}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
      - name: Run Windows regression suite
        working-directory: windows
        run: |
          npm test
          node ../tests/all-platform-embeds-2.2.5.3.test.cjs
          node -e "const p=require('./package.json');if(p.version!=='2.2.5.3'||p.build.buildVersion!=='2.2.5.3')throw Error('Windows version incorrect')"
      - name: Package updated Windows portable ZIP
        working-directory: windows
        run: npm run build
      - name: Verify Windows portable ZIP and optional signature
        shell: pwsh
        run: |
          $zip = Get-Item windows/dist/ZeroPlay-2.2.5.3-Windows-x64.zip -ErrorAction Stop
          if ($zip.Length -lt 5000000) { throw 'Windows ZIP missing or unexpectedly small' }
          if (-not [string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            $exe = Get-ChildItem windows/dist/win-unpacked -Filter *.exe -File | Select-Object -First 1
            if (-not $exe) { throw 'Windows EXE missing' }
            if ((Get-AuthenticodeSignature $exe.FullName).Status -ne 'Valid') { throw 'Windows signing verification failed' }
          } else { Write-Warning 'Windows build is unsigned: no signing credentials configured' }
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroPlay-2.2.5.3-All-Source-Windows
          path: windows/dist/ZeroPlay-2.2.5.3-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  replace_assets:
    if: github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.5.3-All-Source-Android
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ZeroPlay-2.2.5.3-All-Source-Windows
          path: release-assets
      - name: Verify all new binaries and calculate hashes
        run: |
          set -euo pipefail
          cd release-assets
          test -s ZeroPlay-2.2.5.3-Android.apk
          test -s ZeroPlay-2.2.5.3-Android-TV.apk
          test -s ZeroPlay-2.2.5.3-Windows-x64.zip
          sha256sum ZeroPlay-2.2.5.3-Android.apk ZeroPlay-2.2.5.3-Android-TV.apk ZeroPlay-2.2.5.3-Windows-x64.zip > SHA256SUMS.txt
      - name: Replace existing v2.2.5.3 binaries rather than creating a new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v2.2.5.3 --repo "$GITHUB_REPOSITORY" --json body --jq .body > updated-notes.md
          cat >> updated-notes.md <<EOF

          ---
          ## In-place 2.2.5.3 source refresh
          Replaced previously published Android and Android TV APK assets on the existing release, and added a Windows x64 portable ZIP.
          Source options: VidRock, VidNest, VidRift, VidFast and VidAPI; original VidSrc option renamed to VidSrc [Offline].
          VidRift uses its documented iframe embed without a sandbox attribute; browser and process security remain enabled.
          VidAPI player embeds use vaplayer.ru, with possible provider-managed domain whitelisting.
          All new assets built from source commit $GITHUB_SHA, with updated SHA256 checksums.
          Android versionName 2.2.5.3 and versionCode 57 (previously 56) so installation upgrades the prior 2.2.5.3 APK.
          EOF
          gh release upload v2.2.5.3 \
            release-assets/ZeroPlay-2.2.5.3-Android.apk \
            release-assets/ZeroPlay-2.2.5.3-Android-TV.apk \
            release-assets/ZeroPlay-2.2.5.3-Windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v2.2.5.3 --repo "$GITHUB_REPOSITORY" --notes-file updated-notes.md
          gh release view v2.2.5.3 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
